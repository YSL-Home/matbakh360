<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
// GitHub Pages SPA redirect fix
// Store the path and redirect to index.html
var path = window.location.pathname + window.location.search;
// Don't redirect for actual missing files
if (path.endsWith('.html') || path.endsWith('.js') || path.endsWith('.json') || path.endsWith('.css')) {
  document.write('<h1>404 - Page not found</h1>');
} else {
  sessionStorage.setItem('spa_redirect', path);
  window.location.replace('/matbakh360/');
}
</script>
</head>
</html>
