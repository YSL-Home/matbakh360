<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Egg Foo Young","description":"وصفة Egg Foo Young التقليدية","image":"https://www.themealdb.com/images/media/meals/47y6ii1765658818.jpg","recipeCategory":"بحري","cookTime":"PT51M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"617 cal"},"recipeIngredient":["1 cup Unsalted Beef Stock","1 tablespoon Soy Sauce","1 tablespoon Shaoxing Wine","1 tablespoon Oyster Sauce","1/2 tsp Pepper","1 tablespoon Cornstarch","1 tablespoon Water","1 tablespoon Cornstarch","1 tablespoon Water","8 large Egg"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"In a small saucepan, add the beef stock, soy sauce, Shaoxing wine, oyster sauce, and white pepper powder over medium heat. Whisk together and bring to a simmer."},{"@type":"HowToStep","position":2,"text":"Combine the cornstarch and water in a small bowl and whisk to dissolve. Add to the saucepan and whisk until the gravy thickens and coats the back of the spoon, 2 to 3 minutes. Cover the saucepan with a lid and keep it warm on the lowest possible heat."},{"@type":"HowToStep","position":3,"text":"Make the egg foo young batter:"},{"@type":"HowToStep","position":4,"text":"In a medium bowl, whisk together the cornstarch and water until dissolved. Add the eggs, salt, and sugar. Whisk until well combined and there are no more egg white clumps."},{"@type":"HowToStep","position":5,"text":"Add the green onion, bean sprouts, and shrimp. Stir until everything is evenly coated."},{"@type":"HowToStep","position":6,"text":"Fry the egg foo young:"},{"@type":"HowToStep","position":7,"text":"Add the vegetable oil to a large wok; it should reach about 2 inches up the sides. Heat the oil over medium-high heat to 350°F, or until vigorous bubbles form around an inserted wooden chopstick."},{"@type":"HowToStep","position":8,"text":"With a ladle, gently and slowly add 1/4 of the omelet batter. Egg foo young should immediately bubble and puff up like magic. Fry until golden brown and crispy on each side, about 2 minutes per side. If there are any light spots, use a ladle to gently baste it with hot oil."},{"@type":"HowToStep","position":9,"text":"Egg foo young can be a bit tricky to flip. The easiest method is to put a tool in each hand (a spider, slotted spoon, tongs, and large chopsticks are all good candidates) and gently coax the omelet over, pulling up on one side and pushing down and around on the other."},{"@type":"HowToStep","position":10,"text":"Remove the omelet and place it on a paper towel-lined baking sheet. Let it cool for 5 minutes. Meanwhile, repeat with the remaining batter to make 4 omelets. If needed, add more oil to the pan between batches."},{"@type":"HowToStep","position":11,"text":"Serve and enjoy:"},{"@type":"HowToStep","position":12,"text":"Plate each egg foo young over a bed of rice. Spoon the warm gravy over the top and serve immediately."}]}</script>
