<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Kafteji","description":"وصفة Kafteji التقليدية","image":"https://www.themealdb.com/images/media/meals/1bsv1q1560459826.jpg","recipeCategory":"تونسي","cookTime":"PT53M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"617 cal"},"recipeIngredient":["5 Large Potatoes","2 tbs Olive Oil","1 Green Pepper","5 Onions","1 tbs Ras el hanout","500g Pumpkin","24 Skinned Eggs","Pinch Salt","Pinch Pepper"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Peel potatoes and cut into 5cm cubes."},{"@type":"HowToStep","position":2,"text":"Pour 1-2 cm of olive oil into a large pan and heat up very hot. Fry potatoes until golden brown for 20 minutes, turning from time to time. Place on kitchen paper to drain."},{"@type":"HowToStep","position":3,"text":"Cut the peppers in half and remove seeds. Rub a little olive oil on them and place the cut side down on a baking tray. Place them under the grill. Grill until the skin is dark and bubbly. While the peppers are still hot, put them into a plastic sandwich bag and seal it. Take them out after 15 minutes and remove skins."},{"@type":"HowToStep","position":4,"text":"In the meantime, heat more olive oil another pan. Peel the onions and cut into thin rings. Fry for 15 minutes until golden brown, turning them often. Add the Ras el hanout at the end."},{"@type":"HowToStep","position":5,"text":"Cut the pumpkin into 5cm cubes and fry in the same pan you used for the potatoes for 10-15 minutes until it is soft and slightly browned. Place on kitchen paper."},{"@type":"HowToStep","position":6,"text":"Pour the remaining olive oil out of the pan and put all the cooked vegetables into the pan and mix. Whisk eggs and pour them over the vegetables. Put the lid on the pan so that the eggs cook. Put the contents of the pan onto a large chopping board, add salt and pepper and chopped and mix everything with a big knife."}]}</script>
