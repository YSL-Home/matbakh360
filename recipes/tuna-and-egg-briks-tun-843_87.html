<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Tuna and Egg Briks","description":"وصفة Tuna and Egg Briks التقليدية","image":"https://www.themealdb.com/images/media/meals/2dsltq1560461468.jpg","recipeCategory":"حلويات","cookTime":"PT58M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"398 cal"},"recipeIngredient":["2 tbs Olive Oil","8 Spring Onions","200g Spinach","4 Filo Pastry","1 can Tuna","2 Eggs","Dash Hotsauce","4 Chopped Tomatoes","1/4 Cucumber","1 tbs Lemon Juice"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat 2 tsp of the oil in a large saucepan and cook the spring onions over a low heat for 3 minutes or until beginning to soften. Add the spinach, cover with a tight-fitting lid and cook for a further 2–3 minutes or until tender and wilted, stirring once or twice. Tip the mixture into a sieve or colander and leave to drain and cool."},{"@type":"HowToStep","position":2,"text":"Using a saucer as a guide, cut out 24 rounds about 12.5 cm (5 in) in diameter from the filo pastry, cutting 6 rounds from each sheet. Stack the filo rounds in a pile, then cover with cling film to prevent them from drying out."},{"@type":"HowToStep","position":3,"text":"When the spinach mixture is cool, squeeze out as much excess liquid as possible, then transfer to a bowl. Add the tuna, eggs, hot pepper sauce, and salt and pepper to taste. Mix well."},{"@type":"HowToStep","position":4,"text":"Preheat the oven to 200°C (400°F, gas mark 6). Take one filo round and very lightly brush with some of the remaining oil. Top with a second round and brush with a little oil, then place a third round on top and brush with oil."},{"@type":"HowToStep","position":5,"text":"Place a heaped tbsp of the filling in the middle of the round, then fold the pastry over to make a half-moon shape. Fold in the edges, twisting them to seal, and place on a non-stick baking sheet. Repeat with the remaining pastry and filling to make 8 briks in all."},{"@type":"HowToStep","position":6,"text":"Lightly brush the briks with the remaining oil. Bake for 12–15 minutes or until the pastry is crisp and golden brown."},{"@type":"HowToStep","position":7,"text":"Meanwhile, combine the tomatoes and cucumber in a bowl and sprinkle with the lemon juice and seasoning to taste. Serve the briks hot with this salad and the chutney."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Tuna and Egg Briks من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Tuna and Egg Briks إلى حوالي 58 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Tuna and Egg Briks؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 4 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Tuna and Egg Briks؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 398 سعرة حرارية و9 غرام بروتين."}},{"@type":"Question","name":"هل Tuna and Egg Briks سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة صعبة وتحتاج خبرة."}},{"@type":"Question","name":"ما هي مكونات Tuna and Egg Briks؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Olive Oil، Spring Onions، Spinach، Filo Pastry، Tuna."}}]}</script>
