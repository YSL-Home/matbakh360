<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Air fryer patatas bravas","description":"وصفة Air fryer patatas bravas التقليدية","image":"https://www.themealdb.com/images/media/meals/3m8yae1763257951.jpg","recipeCategory":"إسباني","cookTime":"PT35M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"240 cal"},"recipeIngredient":["900g Potatoes","3  tablespoons Olive Oil","1 chopped Onion","1 clove peeled crushed Garlic","1 tblsp Paprika","1 tblsp Tomato Puree","225g Tinned Tomatos","To serve Basil Leaves"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Soak the potatoes in just-boiled water for 30 mins, then drain and leave to air-dry for 5 mins. Heat the air fryer to 200C. Tip the potatoes into a bowl and drizzle over 1 tbsp of the oil and add 1/2 tsp each of salt and freshly ground black pepper. Mix to coat the potatoes all over, then tip into the air fryer basket and cook for 20-30 mins until crisp and golden."},{"@type":"HowToStep","position":2,"text":"Meanwhile, heat the remaining oil in a small pan over a medium-low heat and fry the onion for 8-10 mins until softened but not golden. Stir in the garlic and cook for a minute before adding the paprika and cooking for 30 seconds more. Stir in the tomato purée, cook for 1 min, then tip in the chopped tomatoes. Cook for 5-10 mins over a medium heat until thickened slightly."},{"@type":"HowToStep","position":3,"text":"Once the potatoes are cooked, tip out onto a platter and pour over the tomato sauce. Sprinkle with the basil leaves, then serve."}]}</script>
