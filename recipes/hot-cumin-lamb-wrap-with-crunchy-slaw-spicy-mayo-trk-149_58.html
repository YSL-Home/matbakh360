<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Hot cumin lamb wrap with crunchy slaw & spicy mayo","description":"وصفة Hot cumin lamb wrap with crunchy slaw & spicy mayo التقليدية","image":"https://www.themealdb.com/images/media/meals/jyylmo1763790808.jpg","recipeCategory":"حلويات","cookTime":"PT38M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"432 cal"},"recipeIngredient":["4 small Lamb Leg","2 tsp Olive Oil","1 tsp Ground Cumin","1 tablespoon Sugar","3  tablespoons White Wine Vinegar","2 Carrots","2 sliced Spring Onions","400g White Cabbage","5 Sweet Peppadew Peppers","3  tablespoons Mayonnaise"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat a griddle pan. Rub the lamb steaks with the oil, cumin and some seasoning. Griddle for about 3-4 mins on each side or until cooked to your liking. Place to one side on a plate to rest."},{"@type":"HowToStep","position":2,"text":"In a large bowl, stir the sugar into the vinegar until dissolved. Add the carrots, spring onions, cabbage and some seasoning, and toss together."},{"@type":"HowToStep","position":3,"text":"Blitz the whole peppers and the mayo in a food processor. Add a heap of the salad to each flatbread. Slice the lamb, trimming off any excess fat and lay on top of the salad, drizzling with the resting juices. Spoon over the mayo and scatter with a few of the sliced peppers. Roll up and eat. If using pitta, split and stuff. Serve any extra salad on the side."}]}</script>
