<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Stuffed Bell Peppers with Quinoa and Black Beans","description":"وصفة Stuffed Bell Peppers with Quinoa and Black Beans التقليدية","image":"https://www.themealdb.com/images/media/meals/b66myb1683207208.jpg","recipeCategory":"حلويات","cookTime":"PT21M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"623 cal"},"recipeIngredient":["4 whole Green Pepper","1 tablespoon Olive Oil","1 small finely diced Onion","2 cloves minced Garlic","1 cups Quinoa","1 can Black Beans","1 cup Sweetcorn","1 can Diced Tomatoes","1 teaspoon Cumin","½ tsp Chili Powder"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Preheat your oven to 375°F (190°C). Lightly grease a 9x13-inch baking dish or a similar-sized casserole dish."},{"@type":"HowToStep","position":2,"text":"Place the bell pepper halves in the prepared baking dish, cut side up. Bake for 15-20 minutes, or until slightly softened."},{"@type":"HowToStep","position":3,"text":"While the bell peppers are baking, prepare the filling. In a large skillet, heat the olive oil over medium heat. Add the chopped onion, and cook for 3-4 minutes, until softened. Add the garlic, and cook for another 1 minute, until fragrant."},{"@type":"HowToStep","position":4,"text":"Stir in the cooked quinoa, black beans, corn, diced tomatoes, ground cumin, chili powder, smoked paprika, salt, and pepper. Cook for 5-7 minutes, until heated through. Remove the skillet from heat, and stir in 1 cup of the shredded cheese, if using."},{"@type":"HowToStep","position":5,"text":"Remove the bell peppers from the oven, and carefully stuff each pepper half with the quinoa and black bean mixture. Top the stuffed peppers with the remaining 1/2 cup of shredded cheese, if using."},{"@type":"HowToStep","position":6,"text":"Return the stuffed peppers to the oven, and bake for another 15-20 minutes, until the cheese is melted and the peppers are tender."},{"@type":"HowToStep","position":7,"text":"Remove from the oven, and allow the stuffed peppers to cool for 5 minutes before serving. Garnish with fresh chopped cilantro."}]}</script>
