<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Egyptian Fatteh","description":"وصفة Egyptian Fatteh التقليدية","image":"https://www.themealdb.com/images/media/meals/rlwcc51598734603.jpg","recipeCategory":"مصري","cookTime":"PT36M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"602 cal"},"recipeIngredient":["1lb Beef","1 Onion","1 Chicken Stock Cube","2 Tomatoes","4 Garlic Clove","1 tbs Tomato Puree","2 cups Rice","1/4 cup Noodles","1/4 cup Butter","2 cups Olive Oil"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"To prepare bread for bottom of dish: Take pita bread and rip into bite size pieces. In a frying pan, add about a 1/4 stick of butter, add bread pieces and fry until golden brown and crisp. Put these pieces in a glass baking dish, preferably a square sized dish. Set aside."},{"@type":"HowToStep","position":2,"text":"Then add to same pan, a little more butter, salt, approximately 2 cloves of crushed fresh garlic, and a teaspoon or so of cumin stir around a bit until you can smell aroma, then add fried bread pieces to this mixture, stir to coat bread and put back into glass baking dish. Set aside."},{"@type":"HowToStep","position":3,"text":"To prepare meat: put some butter in a pot, stir fry meat until brown, add 1 onion quartered, salt & pepper, 1 cube of chicken bouillon and water to cover meat. Bring to a boil, turn down to simmer, cover and cook until tender, approximately 2 hours. After meat has cooled, take out chunks of meat and put in a bowl, set aside. Reserve soup from the meat separately."},{"@type":"HowToStep","position":4,"text":"To prepare the rice: Put some butter into a pot, add shareya (fideo noodles) like a handful or so, keep stirring until golden brown, not too dark, but very golden. Then add two cups of rice, stir a little bit until some of the rice turns an opaque white. Add 2-1/4 cups of water and salt to taste. Bring to a boil, cover and turn down to simmer, cook until tender. Test the rice tenderness after about 35 minutes."},{"@type":"HowToStep","position":5,"text":"Now take some of the soup from meat and add to the top of the bread pieces in baking dish to saturate.Add cooked rice on top of bread pieces. Slowly spoon remainder of soup onto rice, looking at glass dish sides to see level of soup, should reach just to top of rice, don’t worry, this doesn’t have to be exact. Now you’re ready to make the sauce and fry the meat to put on top."},{"@type":"HowToStep","position":6,"text":"To prepare red sauce: In a pan, add a little oil or butter, crushed tomato, a half teaspoon of tomato paste, salt & pepper, 2 cloves of fresh crushed garlic and cumin. Add also approximately 3 tablespoons of vinegar, stir this until you smell aroma and it is a bit smooth. It should be a bit thick, not watery, but if too thick you can add a bit of water. Spread with a wooden spoon atop the rice to cover."},{"@type":"HowToStep","position":7,"text":"To fry meat: In a pan add a bit of butter or oil, the meat, just a touch of tomato paste, about a tablespoon of fresh crushed garlic, salt & pepper, a teaspoon of cumin. Cook until meat is golden fried."},{"@type":"HowToStep","position":8,"text":"Spoon this atop the rice and serve. Enjoy!"}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Egyptian Fatteh من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Egyptian Fatteh إلى حوالي 36 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Egyptian Fatteh؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Egyptian Fatteh؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 602 سعرة حرارية و28 غرام بروتين."}},{"@type":"Question","name":"هل Egyptian Fatteh سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة صعبة وتحتاج خبرة."}},{"@type":"Question","name":"ما هي مكونات Egyptian Fatteh؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Beef، Onion، Chicken Stock Cube، Tomatoes، Garlic Clove."}}]}</script>
