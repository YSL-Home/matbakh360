<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Arroz al horno (baked rice)","description":"وصفة Arroz al horno (baked rice) التقليدية","image":"https://www.themealdb.com/images/media/meals/qt4i0n1763256454.jpg","recipeCategory":"حلويات","cookTime":"PT58M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"209 cal"},"recipeIngredient":["2 tbsp Extra Virgin Olive Oil","800g Pork belly slices","150g Black Pudding","100g Bacon lardon","1 chopped Onion","2 Red Pepper","1 chopped Plum Tomatoes","8 Garlic Clove","4 teaspoons Paprika","1/2 teaspoon Chilli Flakes"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat oven to 200C/180C/gas 6. Heat half the oil in a deep frying or sauté pan (or shallow casserole dish) measuring around 30cm in diameter. Over a high heat, colour the pork belly slices on each side in several batches, then transfer to a bowl. Add the remaining oil to the pan and lower the heat to medium, then add the black pudding and bacon and fry all over for several mins. Remove with a slotted spoon. Fry the onion and peppers for around 10 mins until soft and pale gold, then add the tomato and cook until soft. Add the garlic, smoked paprika and chilli flakes and cook for another 2 mins, then put the pork, black pudding and bacon back in the pan. Add the beans, stock and whichever herb you're using, and bring everything to the boil."},{"@type":"HowToStep","position":2,"text":"Sprinkle the rice around the pork belly, pushing it underneath the stock. Let the stock come to the boil again, season well, then transfer to the oven (leave it uncovered). Cook for 20 mins without stirring, then check to see how the rice is doing. The rice should be tender and the stock absorbed. If it’s not ready, put back in the oven for another 5 mins, then check again. Taste for seasoning."},{"@type":"HowToStep","position":3,"text":"Squeeze lemon juice over the top and drizzle over some extra virgin olive oil just before serving, if you like."}]}</script>
