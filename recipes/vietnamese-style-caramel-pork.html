<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Vietnamese-style caramel pork","description":"وصفة Vietnamese-style caramel pork التقليدية","image":"https://www.themealdb.com/images/media/meals/4mzt101763761546.jpg","recipeCategory":"حلويات","cookTime":"PT56M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"410 cal"},"recipeIngredient":["1 ½ tbsp Ground Nut Oil","500g Pork Shoulder Steaks","2 chopped Shallots","1 tablespoon Ground Ginger","1 chopped Red Chilli","75g Brown Sugar","1 tablespoon Fish Sauce","2 tsp Chilli Sauce","4 Spring Onions","Steamed Rice"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat 1 tbsp of the oil in a wok over a high heat and stir-fry the pork in batches until browned all over. Remove with a slotted spoon and set aside."},{"@type":"HowToStep","position":2,"text":"Turn the heat right down and add the remaining oil, then stir in the shallots, ginger and chilli. Cook over a low heat for a couple of mins until just starting to soften. Add the sugar, fish sauce and 200ml water to the pan and stir everything together. Bring to the boil, stirring, so that the sugar dissolves, then return the pork to the pan. Bubble vigorously for 8-10 mins until the sauce thickens to coat the meat and become glossy. Taste and stir in a little more fish sauce, if needed, along with the chilli sauce. Sprinkle with the spring onions and serve with steamed rice and pak choi."}]}</script>
