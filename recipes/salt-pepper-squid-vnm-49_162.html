<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Salt & pepper squid","description":"وصفة Salt & pepper squid التقليدية","image":"https://www.themealdb.com/images/media/meals/yxiilf1763759428.jpg","recipeCategory":"بحري","cookTime":"PT33M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"431 cal"},"recipeIngredient":["85g Corn Flour","85g Plain Flour","2 tsp Black Pepper","2 tsp Szechuan Peppercorns","For frying Sunflower Oil","400g Squid","Sliced Spring Onions","Sliced Green Chilli","1 chopped Red Chilli","1/2 Cucumber"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"To make the dipping sauce, mix all the ingredients in a small bowl until the sugar has dissolved, then set aside. Mix the cornflour and plain flour with both peppers and 2 tsp sea salt in a large bowl, then set aside. Line a tray with kitchen paper and make sure you have more salt to sprinkle with."},{"@type":"HowToStep","position":2,"text":"Heat about 7cm of oil to 180C in a deep fryer, wok or deep pan. If you don’t have a thermometer, you can test it with a cube of bread – it should brown in 20 secs. Coat the squid well with the flour mix and fry in batches for about 2 mins each or until crisp. Use a slotted spoon to lift out the squid, then drain on the kitchen paper and sprinkle with a little more salt. Serve the squid scattered with the spring onion and chilli, with the dipping sauce on the side."}]}</script>
