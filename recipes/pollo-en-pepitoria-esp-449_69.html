<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Pollo en pepitoria","description":"وصفة Pollo en pepitoria التقليدية","image":"https://www.themealdb.com/images/media/meals/li30ck1763281992.jpg","recipeCategory":"إسباني","cookTime":"PT44M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"620 cal"},"recipeIngredient":["Pinch Saffron","4 tbsp Extra Virgin Olive Oil","6 Garlic Clove","35g Almonds","30g Stale bread","2 tbs chopped Parsley","8 Chicken Thighs","1 chopped Onion","1 chopped Carrots","1 chopped Celery"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put the saffron in a small bowl with 75ml of just-boiled water. Stir and set aside. Heat 2 tbsp of the oil in a broad, shallow casserole dish. Cook the garlic until pale gold in colour, then add the blanched almonds and bread, and continue to fry until everything is golden. Tip into a food processor with some salt and pepper and the parsley, and whizz together."},{"@type":"HowToStep","position":2,"text":"Heat 2 more tbsp of the oil in the pan and brown the chicken all over, seasoning as you cook. Put in a bowl and set aside."},{"@type":"HowToStep","position":3,"text":"Remove all but about 2 tbsp of chicken fat from the pan and cook the onion, carrot and celery until golden. Add the sherry, stirring to dislodge any brown bits that have stuck to the pan. Pour in the stock and the saffron (with its water), and bring to the boil, then turn the heat down to a simmer. Add the spices and bay leaves, and put the chicken back in the pan with any juices. Season and gently cook the chicken for about 40 mins with the lid on."},{"@type":"HowToStep","position":4,"text":"Transfer the chicken to a bowl again, leaving the sauce in the pan, and cover with foil to keep warm. Remove the yolks from the eggs and roughly chop the whites. Mash the egg yolks in a small bowl and gradually mix in a couple of tbsp of the sauce. Bring the remaining sauce to the boil to reduce a bit (you want it to just coat the chicken), then turn the heat down. Remove the bay and cinnamon stick. Add the egg yolks and cook for a few mins until the mixture has thickened. Stir in the almond mixture that you made earlier (this will thicken the sauce, too). Put the chicken back in the pan and heat it for about 3 mins, spooning the sauce over it. Season to taste."},{"@type":"HowToStep","position":5,"text":"Scatter over the extra parsley, the almonds pieces and the chopped egg whites (if you’re going to use them). You can serve this straight from the dish with some rice, if you like."}]}</script>
