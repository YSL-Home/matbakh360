<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cacik","description":"وصفة Cacik التقليدية","image":"https://www.themealdb.com/images/media/meals/16zbeu1763789342.jpg","recipeCategory":"تركي","cookTime":"PT38M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"540 cal"},"recipeIngredient":["500g Natural Yoghurt","2 tsp Lemon Juice","1 tablespoon Extra Virgin Olive Oil","1 tablespoon Dried Mint","1 Cucumber","2 cloves minced Garlic"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put a sieve over a large bowl, line it with a thick sheet of non-dyed kitchen paper or a clean muslin cloth, and spoon in the yogurt. Cover with another sheet of kitchen paper and leave to strain in the fridge for a minimum of 12 hrs."},{"@type":"HowToStep","position":2,"text":"Add the lemon juice, most of the olive oil and the dried mint to a bowl and stir well for the dried mint to soften and soak up the juices. Mix in the strained yogurt, then pour away the strained yogurt liquid and leave that bowl to one side."},{"@type":"HowToStep","position":3,"text":"Halve the cucumber(s) lengthways and remove the seeds by running a teaspoon from the top to the bottom of the flesh, halve the cucumbers widthways to make them shorter and easier to handle, then coarsely grate each one into the bowl the yogurt was straining over. Using clean hands (or a clean muslin cloth), squeeze as much of the liquid out of the cucumber as possible."},{"@type":"HowToStep","position":4,"text":"Add the strained, grated cucumber, garlic and ¾ tsp flaky salt to the rest of the ingredients and mix well. Garnish with a drizzle of extra virgin olive oil and a sprinkling of dried mint."}]}</script>
