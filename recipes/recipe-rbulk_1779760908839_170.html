<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Napa Cabbage with Dried Shrimp","description":"وصفة Napa Cabbage with Dried Shrimp التقليدية","image":"https://www.themealdb.com/images/media/meals/9nh4dl1766435484.jpg","recipeCategory":"بحري","cookTime":"PT21M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"317 cal"},"recipeIngredient":["2 tablespoons Dried Shrimp","3/4 cup Boiling Water","1 head Napa Cabbage","2 tablespoons Peanut Oil","4 Chopped Scallions","1 tablespoon Ginger","1 tablespoon Soy Sauce","1 tablespoon Water","2 tsp Cornstarch","1 tsp Kosher Salt"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Dried shrimp gives this Chinese dish a punch of salty umami flavor. You can find it at an Asian grocery store in the frozen or refrigerated section. Look for small-sized dried shrimp, about a 1/4-inch in size. If you use medium or large dried shrimp, hydrate the shrimp with more water (1 cup for medium-sized shrimp, 1 1/4 cup for large) and for longer time (45 to 60 minutes), then chop it up into smaller 1/4-inch chunks. To make this recipe vegetarian, omit the dried shrimp and use four or five dried shiitake mushrooms, rehydrated, and sliced thin."},{"@type":"HowToStep","position":2,"text":"Rehydrate the dried shrimp:"},{"@type":"HowToStep","position":3,"text":"Place the dried shrimp in a small bowl and pour the boiling water over it. Cover with a small plate and let sit for 30 minutes so the shrimp can rehydrate. The shrimp will be lighter in color and plump up slightly."},{"@type":"HowToStep","position":4,"text":"Prep the cabbage:"},{"@type":"HowToStep","position":5,"text":"Meanwhile, split the napa cabbage in half lengthwise. Rinse the cabbage and shake it dry. Cut out the core of the cabbage and discard."},{"@type":"HowToStep","position":6,"text":"Set out two large bowls. Cut the remaining cabbage into 1-inch pieces, putting the thicker white pieces at the bottom of the cabbage into one bowl and the top thinner leafy green pieces into the other bowl."},{"@type":"HowToStep","position":7,"text":"Drain the shrimp:"},{"@type":"HowToStep","position":8,"text":"Once the shrimp has rehydrated, drain it and discard the liquid."},{"@type":"HowToStep","position":9,"text":"Cook the shrimp and cabbage:"},{"@type":"HowToStep","position":10,"text":"In a large wok or skillet over high heat add the peanut oil, swirling it around to coat the pan."},{"@type":"HowToStep","position":11,"text":"Heat until the oil looks shimmering hot, then carefully add the scallions, ginger, and rehydrated shrimp, paying specially attention as the wet ingredients may cause the hot oil to splatter. Toss with a spatula until the scallions are bright green and the entire mixture is fragrant, about 1 minute."},{"@type":"HowToStep","position":12,"text":"Add the thicker white part of the napa cabbage to the pan and lower the heat to medium high. Continue to cook and stir for 3 to 4 minutes, or until the edges of the cabbage pieces start to look slightly translucent but the center of the cabbage pieces are still opaque white."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Napa Cabbage with Dried Shrimp من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Napa Cabbage with Dried Shrimp إلى حوالي 21 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Napa Cabbage with Dried Shrimp؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Napa Cabbage with Dried Shrimp؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 317 سعرة حرارية و27 غرام بروتين."}},{"@type":"Question","name":"هل Napa Cabbage with Dried Shrimp سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Napa Cabbage with Dried Shrimp؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Dried Shrimp، Boiling Water، Napa Cabbage، Peanut Oil، Scallions."}}]}</script>
