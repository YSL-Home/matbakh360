<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Adana kebab","description":"وصفة Adana kebab التقليدية","image":"https://www.themealdb.com/images/media/meals/04axct1763793018.jpg","recipeCategory":"تركي","cookTime":"PT34M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"425 cal"},"recipeIngredient":["2 large Romano Pepper","800g Lamb Mince","3  tablespoons Red Pepper Paste","1 tablespoon Pul Biber","3  tablespoons Sunflower Oil"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Finely chop the peppers in a food processor, then tip them in a sieve and press into the sieve so that the peppers release all of their juices. Tip into a bowl along with the mince, red pepper paste, pul biber, 1½ tsp flaky sea salt, and 2 tbsp of the oil. Mix together, kneading well for at least 2-3 mins. If you need to, wet your hands with cold water to prevent the mixture from sticking. The mixture should be sticky when ready. Cover and chill for at least 2 hrs, or up to 12 hrs."},{"@type":"HowToStep","position":2,"text":"When ready to cook, heat the grill to high or an oven to 220C/200C fan/gas 6. Divide the mixture into 12 equal portions, around 85g each. If you’d like to skewer them, divide into 8 equal portions and roll into balls. Using wet hands, thread the balls onto the end of the skewers, massaging the mixture down the skewers in between the palms of your hands, until evenly distributed. Ensure that the mixture is fully wrapped tightly around the skewers without any exposed metal. Alternatively, lay them on a large baking tray lined with parchment paper if cooking in the oven, or foil if cooking under the grill. Shape into 20cm-long köfte. Wet your fingers with a little cold water and make indents all along the köfte for the traditional shape."},{"@type":"HowToStep","position":3,"text":"Gently brush each köfte with the remaining 1 tbsp oil and cook under the grill, on the top shelf for 10-12 mins, turning regularly, or cook in the oven for 16-18 mins, until crispy on the outside and juicy in the middle"}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Adana kebab من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Adana kebab إلى حوالي 34 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Adana kebab؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Adana kebab؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 425 سعرة حرارية و22 غرام بروتين."}},{"@type":"Question","name":"هل Adana kebab سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة صعبة وتحتاج خبرة."}},{"@type":"Question","name":"ما هي مكونات Adana kebab؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 5 مكونات أساسية منها: Romano Pepper، Lamb Mince، Red Pepper Paste، Pul Biber، Sunflower Oil."}}]}</script>
