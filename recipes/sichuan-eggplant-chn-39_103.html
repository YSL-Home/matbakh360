<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Sichuan Eggplant","description":"وصفة Sichuan Eggplant التقليدية","image":"https://www.themealdb.com/images/media/meals/1oz4nb1765687990.jpg","recipeCategory":"صيني","cookTime":"PT38M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"504 cal"},"recipeIngredient":["1.5 pounds sliced Egg Plants","2 tablespoons Peanut Oil","1/4 cup Chicken Stock","2 tsp Sugar","1/2 tsp Soy Sauce","1 ½ tbsp Chilli Bean Paste","2 tsp Sichuan Pepper","2 tsp Ginger","5 cloves Garlic","1 tsp Cornstarch"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"This recipe calls for asian eggplants, or Japanese eggplants. They are long and thin compared to a European or globe eggplant, and much more tender and delicate. If you can't find them you can substitute globe eggplant, but the dish is really best with the asian eggplant."},{"@type":"HowToStep","position":2,"text":"*A lot of grocery stores have Asian ingredient aisles now. You should be able to find chili-bean paste, a mixture of preserved chilies mixed with mashed soybeans, there or at any Asian market. (Do not confuse with black bean paste or chili-garlic paste.)"},{"@type":"HowToStep","position":3,"text":"**Sichuan peppercorns are available at some stores and online for quite cheap. They aren't spicy like other peppers but rather have a citrusy flavor and induce a tingly, numbing sensation like a carbonated drink."},{"@type":"HowToStep","position":4,"text":"Prep eggplant, chili sauce, cornstarch slurry, vinegar and scallions:"},{"@type":"HowToStep","position":5,"text":"Begin your mise en place. Quarter the eggplant lengthwise and chop into large batons and set aside."},{"@type":"HowToStep","position":6,"text":"In a small bowl, mix together the chicken stock, sugar, and soy sauce and set it aside."},{"@type":"HowToStep","position":7,"text":"In a second bowl, mix together the chili bean paste, garlic, ginger, and sichuan peppercorns and set it aside."},{"@type":"HowToStep","position":8,"text":"In a third bowl, mix together the cornstarch with a tablespoon of water and set it aside."},{"@type":"HowToStep","position":9,"text":"Lastly, in a fourth bowl, mix together the scallions and vinegar and set it aside."},{"@type":"HowToStep","position":10,"text":"Place the oil in a wok or large sauté pan over medium-high heat until the oil is almost smoking. Add the eggplant and sauté, allowing it to sit for a few seconds each time you move it to allow it to brown and blister. If the eggplant absorbs all the oil and some pieces don't get any then add a little more oil."},{"@type":"HowToStep","position":11,"text":"Add the chili bean paste, garlic, ginger, and sichuan peppercorns and sauté:"},{"@type":"HowToStep","position":12,"text":"until fragrant, about 30 seconds."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Sichuan Eggplant من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Sichuan Eggplant إلى حوالي 38 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Sichuan Eggplant؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Sichuan Eggplant؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 504 سعرة حرارية و36 غرام بروتين."}},{"@type":"Question","name":"هل Sichuan Eggplant سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Sichuan Eggplant؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Egg Plants، Peanut Oil، Chicken Stock، Sugar، Soy Sauce."}}]}</script>
