<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Ma Po Tofu","description":"وصفة Ma Po Tofu التقليدية","image":"https://www.themealdb.com/images/media/meals/1525874812.jpg","recipeCategory":"صحي","cookTime":"PT32M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"220 cal"},"recipeIngredient":["450g Tofu","100g Minced Beef","1/2 tbs Sesame Seed Oil","1 1/2 tsp Doubanjiang","1/2 tsp Fermented Black Beans","1 tbs Pepper","1/2 tsp Salt","1/2 tsp Sichuan pepper","1 tbs Soy Sauce","400ml Water"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Add a small pinch of salt and sesame oil to minced beef. Mix well and set aside."},{"@type":"HowToStep","position":2,"text":"Mix 1 tablespoon of cornstarch with 2 and ½ tablespoons of water in a small bowl to make water starch."},{"@type":"HowToStep","position":3,"text":"Cut tofu into square cubes (around 2cms). Bring a large amount of water to a boil and then add a pinch of salt. Slide the tofu in and cook for 1 minute. Move out and drain."},{"@type":"HowToStep","position":4,"text":"Get a wok and heat up around 2 tablespoons of oil, fry the minced meat until crispy. Transfer out beef out and leave the oil in."},{"@type":"HowToStep","position":5,"text":"Fry doubanjiang for 1 minute over slow fire and then add garlic, scallion white, ginger and fermented black beans to cook for 30 seconds until aroma. Then mix pepper flakes in."},{"@type":"HowToStep","position":6,"text":"Add water to the seasonings and bring to boil over high fire. Gently slide the tofu cubes. Add light soy sauce and beef.Slow the heat after boiling and then simmer for 6-8 minutes. Then add chopped garlic greens."},{"@type":"HowToStep","position":7,"text":"Stir the water starch and then pour half of the mixture to the simmering pot. Wait for around 30 seconds and then pour the other half. You can slightly taste the tofu and add pinch of salt if not salty enough. By the way, if you feel it is too spicy, add some sugar can milder the taste. But be carefully as the broth is very hot at this point."},{"@type":"HowToStep","position":8,"text":"Transfer out when almost all the seasonings stick to tofu cubes. Sprinkle Szechuan peppercorn powder (to taste)and chopped garlic greens if using."},{"@type":"HowToStep","position":9,"text":"Serve immediately with steamed rice."}]}</script>
