<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Thai rice noodle salad","description":"وصفة Thai rice noodle salad التقليدية","image":"https://www.themealdb.com/images/media/meals/6g3rso1763486069.jpg","recipeCategory":"بحري","cookTime":"PT32M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"644 cal"},"recipeIngredient":["1/2 bag Vermicelli Rice Noodles","200g Bean Sprouts","Zest and juice of 2 Lime","2-3 tbsp Fish Sauce","1 tsp Muscovado Sugar","1 sliced Red Onions","2 small Lettuce","500g Minced Pork","Knob Ginger","Pinch Cayenne Pepper"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Place the noodles and beansprouts in a heatproof bowl and cover with boiling water. Leave for 4 mins, or until the noodles are tender. Drain, then cool under cold running water and drain again. Return to the bowl."},{"@type":"HowToStep","position":2,"text":"Stir together the lime zest and juice, fish or soy sauce and sugar. Stir into the noodles with the red onion and lettuce."},{"@type":"HowToStep","position":3,"text":"To make with mince, heat a little oil in a non-stick frying pan and stir-fry 500g minced pork, a small knob of grated ginger and pinch cayenne pepper or chilli powder for 10 mins, until the mince is browned and cooked through. Mix into the noodles, divide between four bowls and serve warm."},{"@type":"HowToStep","position":4,"text":"To make with steak, make the rice noodle salad. Heat 1 tsp sunflower oil in a frying pan. Tip 2 tbsp sesame seeds onto a plate. Rub 1 tsp oil into 4 x 175g sirloin steaks and press into sesame seeds. Fry for 5 mins for medium rare, turning halfway. Leave to rest for 5 mins, then thinly slice. Toss 1 deseeded and shredded red chilli, and a handful mint leaves into noodles. Top with steak to serve."}]}</script>
