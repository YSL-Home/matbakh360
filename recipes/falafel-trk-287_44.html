<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Falafel","description":"وصفة Falafel التقليدية","image":"https://www.themealdb.com/images/media/meals/u5e9qq1763795441.jpg","recipeCategory":"تركي","cookTime":"PT31M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"535 cal"},"recipeIngredient":["2 tablespoons Sunflower Oil","1 chopped Onion","1 clove peeled crushed Garlic","400g Chickpeas","1 tsp Ground Cumin","1 tsp Ground Coriander","Handful Parsley","1 beaten Egg"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat 1 tbsp oil in a large pan, then fry the onion and garlic over a low heat for 5 mins until softened. Tip into a large mixing bowl with the chickpeas and spices, then mash together with a fork or potato masher until the chickpeas are totally broken down. Stir in the parsley or dried herbs, with seasoning to taste. Add the egg, then squish the mixture together with your hands."},{"@type":"HowToStep","position":2,"text":"Mould the mix into 6 balls, then flatten into patties. Heat the remaining oil in the pan, then fry the falafels on a medium heat for 3 mins on each side, until golden brown and firm. Serve hot or cold with couscous, pitta bread or salad."}]}</script>
