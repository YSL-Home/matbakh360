<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken Karaage","description":"وصفة Chicken Karaage التقليدية","image":"https://www.themealdb.com/images/media/meals/tyywsw1505930373.jpg","recipeCategory":"ياباني","cookTime":"PT46M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"593 cal"},"recipeIngredient":["450 grams Boneless skin Chicken","1 tablespoon Ginger","1 clove Garlic","2 tablespoons Soy sauce","1 tablespoon Sake","2 teaspoon Granulated sugar","1/3 cup Potato starch","1/3 cup Vegetable oil","1/3 cup Lemon"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Add the ginger, garlic, soy sauce, sake and sugar to a bowl and whisk to combine. Add the chicken, then stir to coat evenly. Cover and refrigerate for at least 1 hour."},{"@type":"HowToStep","position":2,"text":"Add 1 inch of vegetable oil to a heavy bottomed pot and heat until the oil reaches 360 degrees F. Line a wire rack with 2 sheets of paper towels and get your tongs out. Put the potato starch in a bowl"},{"@type":"HowToStep","position":3,"text":"Add a handful of chicken to the potato starch and toss to coat each piece evenly."},{"@type":"HowToStep","position":4,"text":"Fry the karaage in batches until the exterior is a medium brown and the chicken is cooked through. Transfer the fried chicken to the paper towel lined rack. If you want the karaage to stay crispy longer, you can fry the chicken a second time, until it's a darker color after it's cooled off once. Serve with lemon wedges."}]}</script>
