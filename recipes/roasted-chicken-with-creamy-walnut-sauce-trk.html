<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Roasted chicken with creamy walnut sauce","description":"وصفة Roasted chicken with creamy walnut sauce التقليدية","image":"https://www.themealdb.com/images/media/meals/ro8mzj1763800655.jpg","recipeCategory":"تركي","cookTime":"PT37M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"357 cal"},"recipeIngredient":["8 Chicken Thighs","1 tsp Cumin","1/2 tsp Paprika","2 tablespoons Olive Oil","6 Pita Bread","150ml Chicken Stock","175g Walnuts","1 chopped Onion","2 cloves chopped Garlic","50 ml Single Cream"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat oven to 200C/180C fan/gas 6. In a roasting tin, toss together the chicken, cumin, paprika, 1 tbsp olive oil and seasoning. Cook for 40 mins until the chicken is crisp and cooked through."},{"@type":"HowToStep","position":2,"text":"Meanwhile, tear up 1 pitta bread and place in a small bowl. Pour over a couple of tbsp chicken stock and leave to soak. Dry-fry the walnuts in a frying pan for about 3 mins until golden and toasted. Set aside. Heat the remaining oil in the pan and cook the onion and garlic until softened. Place the softened pitta bread, onion mixture and most of the nuts into a blender. Pour over the rest of the chicken stock and whizz together until a rough paste forms. Return the mixture to the pan. Add the cream and lemon juice, season and keep warm."},{"@type":"HowToStep","position":3,"text":"When the chicken is cooked, arrange on a platter. Stir the coriander through the sauce and spoon into a bowl. Roughly chop the remaining walnuts and scatter over the chicken. Toast the pittas, cut into wedges and serve alongside"}]}</script>
