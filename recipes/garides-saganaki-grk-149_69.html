<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Garides Saganaki","description":"وصفة Garides Saganaki التقليدية","image":"https://www.themealdb.com/images/media/meals/wuvryu1468232995.jpg","recipeCategory":"بحري","cookTime":"PT47M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"389 cal"},"recipeIngredient":["500g Raw king prawns","3 tablespoons Olive oil","1 Chopped onion","pinch Freshly chopped parsley","250ml White wine","1 (400g) tin Chopped tomatoes","1/2 teaspoon Minced garlic","1 (200g) pack Cubed Feta cheese"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Place the prawns in a pot and add enough water to cover. Boil for 5 minutes. Drain, reserving the liquid, and set aside."},{"@type":"HowToStep","position":2,"text":"Heat 2 tablespoons of oil in a saucepan. Add the onion; cook and stir until soft. Mix in the parsley, wine, tomatoes, garlic and remaining olive oil. Simmer, stirring occasionally, for about 30 minutes, or until the sauce is thickened."},{"@type":"HowToStep","position":3,"text":"While the sauce is simmering, the prawns should become cool enough to handle. First remove the legs by pinching them, and then pull off the shells, leaving the head and tail on."},{"@type":"HowToStep","position":4,"text":"When the sauce has thickened, stir in the prawns. Bring to a simmer again if the sauce has cooled with the prawns, and cook for about 5 minutes. Add the feta and remove from the heat. Let stand until the cheese starts to melt. Serve warm with slices of crusty bread."},{"@type":"HowToStep","position":5,"text":"Though completely untraditional, you can add a few tablespoons of stock or passata to this recipe to make a delicious pasta sauce. Toss with pasta after adding the feta, and serve."}]}</script>
