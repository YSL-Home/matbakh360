<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Ensaimada","description":"وصفة Ensaimada التقليدية","image":"https://www.themealdb.com/images/media/meals/1ugsho1763248007.jpg","recipeCategory":"إسباني","cookTime":"PT46M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"250 cal"},"recipeIngredient":["5g Yeast","200g Caster Sugar","2 medium Egg","600g Strong white bread flour","Drizzle Vegetable Oil","100g Lard"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Pour 230ml lukewarm water into a bowl and add the yeast. Leave to stand for 3 mins, then add the caster sugar, eggs, flour and 1 tsp sea salt flakes. Mix together to form a dough, then knead for 10 mins in stand mixer using a dough hook (or 15 mins by hand) until the dough is elastic enough to be almost see-through when stretched. Cover and set aside to rest for 30 mins, then cut into four equal pieces. Transfer to a baking tray lined with baking parchment. Leave to rest for another 30 mins."},{"@type":"HowToStep","position":2,"text":"Oil the work surface and a rolling pin with vegetable oil. Working with one portion of dough at a time, flatten it against the surface using the palm of your hand, then roll it out into a thin rectangle, about 30 x 50cm. Let it rest for 2 mins while you spread a quarter of the lard over the top. (If you want to fill your pastry with sobrasada de Mallorca, mix 50g lard with the sobrasada, and spread this over the dough instead.) Pull one corner of the flattened dough and stretch it out as far as it will go without breaking. Repeat every 10cm or so around the dough rectangle in every direction until it reaches about 50 x 70cm."},{"@type":"HowToStep","position":3,"text":"Cut a strip from each of the shorter sides and lay these beside each other along one of the longer sides of the rectangle; this is what we call the heart of the ensaimada. From there, begin rolling the dough until you have a long pastry snake. Repeat with the remaining portions of dough."},{"@type":"HowToStep","position":4,"text":"Take the first roll of dough and stretch it until it is over a metre long. Then, roll it up into a spiral, leaving 1cm between each turn of the spiral so the dough can expand. Flatten a little and transfer to a baking sheet lined with baking parchment. Repeat with the remaining dough. Leave to rise in a warm place for at least 12 hrs, or ideally 24 hrs."},{"@type":"HowToStep","position":5,"text":"Heat the oven to 200C/180C fan/gas 6. Put the ensaimadas in the top third of the oven and immediately reduce the temperature to 180C/160C fan/gas 4. Bake for 18 mins until dark golden. Leave to cool on a wire rack. To fill your ensaimada with whipped cream, slice and open, then spread over the cream and close. Dust with a generous amount of icing sugar, if you like and cut into pieces to serve."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Ensaimada من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Ensaimada إلى حوالي 46 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Ensaimada؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Ensaimada؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 250 سعرة حرارية و19 غرام بروتين."}},{"@type":"Question","name":"هل Ensaimada سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Ensaimada؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 6 مكونات أساسية منها: Yeast، Caster Sugar، Egg، Strong white bread flour، Vegetable Oil."}}]}</script>
