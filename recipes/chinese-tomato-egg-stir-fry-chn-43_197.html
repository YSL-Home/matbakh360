<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chinese Tomato Egg Stir Fry","description":"وصفة Chinese Tomato Egg Stir Fry التقليدية","image":"https://www.themealdb.com/images/media/meals/rwvw8q1765660071.jpg","recipeCategory":"صيني","cookTime":"PT40M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"612 cal"},"recipeIngredient":["1 lb Plum Tomatoes","1 tablespoon Vegetable Oil","5 Large Eggs","1 tsp Sesame Seed Oil","2 tsp Chicken Bouillon Powder","2 tsp Sugar","1/2 tsp Pepper","1/4 tsp Salt","1 Spring Onions","2 cups Jasmine Rice"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"You can use chicken broth in place of the chicken bouillon powder. Add 1/4 cup of broth followed by 2 teaspoons of cornstarch dissolved in 1 tablespoPrepare the tomatoes:"},{"@type":"HowToStep","position":2,"text":"Slice the tomatoes in half. Remove the tough stem from each half that connects to the vine. Cut each half into equal thirds (you’ll get 6 slices from each tomato)."},{"@type":"HowToStep","position":3,"text":"Make the soft scrambled eggs:"},{"@type":"HowToStep","position":4,"text":"In a cold, 8 to 10-inch nonstick skillet, add the vegetable oil and beaten eggs. Turn the heat to medium. Once a thin layer of eggs is just beginning to cook on the bottom, push the eggs in one direction to create layers of scrambled eggs."},{"@type":"HowToStep","position":5,"text":"Cook, gently stirring the whole time, until the scramble eggs are mostly set but still slightly wet and shiny, 2 to 5 minutes. Remove the eggs to a plate and, if needed, wipe out the pan."},{"@type":"HowToStep","position":6,"text":"Stir-fry the tomatoes and seasonings:"},{"@type":"HowToStep","position":7,"text":"Add the sesame oil to the pan followed by the tomatoes and stir-fry over medium heat until the tomatoes are softened but not mushy, about 3 minutes. Add the chicken bouillon powder, sugar, and white pepper. Toss until combined and the sugar and bouillon have dissolved, about 1 minute."},{"@type":"HowToStep","position":8,"text":"Add eggs, stir-fry, and garnish:"},{"@type":"HowToStep","position":9,"text":"Add the eggs back to the pan with the tomatoes. Stir-fry for about 2 minutes to heat through and combine. Taste, adding salt only if needed. Sprinkle with the green onions and serve with steamed rice.on of water, plus salt to taste."}]}</script>
