<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Tunisian Orange Cake","description":"وصفة Tunisian Orange Cake التقليدية","image":"https://www.themealdb.com/images/media/meals/y4jpgq1560459207.jpg","recipeCategory":"حلويات","cookTime":"PT50M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"224 cal"},"recipeIngredient":["1 large Orange","300g Caster Sugar","75 ml Olive Oil","280g Flour","1 tbs Baking Powder","4 large Eggs","2 tsp Vanilla Extract"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Preheat oven to 190 C / Gas 5. Grease a 23cm round springform tin."},{"@type":"HowToStep","position":2,"text":"Cut off the hard bits from the top and bottom of the orange. Slice the orange and remove all seeds. Puree the orange with its peel in a food processor. Add one third of the sugar and the olive oil and continue to mix until well combined."},{"@type":"HowToStep","position":3,"text":"Sieve together flour and baking powder."},{"@type":"HowToStep","position":4,"text":"Beat the eggs and the remaining sugar with an electric hand mixer for at least five minutes until very fluffy. Fold in half of the flour mixture, then the orange and the vanilla, then fold in the remaining flour. Mix well but not for too long."},{"@type":"HowToStep","position":5,"text":"Pour cake mixture into prepared tin and smooth out. Bake in preheated oven for 20 minutes. Reduce the oven temperature to 160 C / Gas 2 and bake again for 30 minutes Bake until the cake is golden brown and a skewer comes out clean. Cool on a wire cake rack."}]}</script>
