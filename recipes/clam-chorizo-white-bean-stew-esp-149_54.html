<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Clam, chorizo & white bean stew","description":"وصفة Clam, chorizo & white bean stew التقليدية","image":"https://www.themealdb.com/images/media/meals/92wbmf1763252334.jpg","recipeCategory":"بحري","cookTime":"PT26M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"405 cal"},"recipeIngredient":["50g Chorizo","1 chopped Onion","1 Garlic Clove","Bunch Parsley","200ml Vegetable Stock","400g Tinned Tomatos","400g Butter Beans","1 teaspoon Sherry vinegar","600g Clams","To serve Crusty Bread"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Fry the chorizo in a large frying pan with a lid, over a medium heat until it is starting to crisp up and release its oil. Add the onion and cook for 5 mins until starting to soften. Then add the garlic and finely chopped parsley, and fry for 1 min more."},{"@type":"HowToStep","position":2,"text":"Pour on the stock and tomatoes. Bring to the boil, reduce the heat, then add the beans and sherry vinegar. Simmer for 10 mins until the liquid is slightly reduced."},{"@type":"HowToStep","position":3,"text":"Scatter over the clams, cover with the lid and steam for 2-4 mins, shaking the pan occasionally until the clams are open. Have a little taste before seasoning, as the clams can be quite salty. Then scatter over the chopped parsley. Eat with lots of crusty bread."}]}</script>
