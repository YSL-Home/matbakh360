<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken Fried Rice","description":"وصفة Chicken Fried Rice التقليدية","image":"https://www.themealdb.com/images/media/meals/wuyd2h1765655837.jpg","recipeCategory":"صيني","cookTime":"PT32M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"371 cal"},"recipeIngredient":["1 lb Chicken Thighs","1 tsp Salt","3  tablespoons Canola Oil","3 Large Egg","2/3 Cup Onion","2 cloves minced Garlic","2 tsp Ground Ginger","1 large Carrots","2/3 Cup Peas","4 cups Jasmine Rice"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Fried rice is best made with leftover rice that's at least a day old. Otherwise it becomes gummy in the skillet."},{"@type":"HowToStep","position":2,"text":"If you don’t have any leftover rice from the night before, cook a batch of rice and spread it on a large baking sheet or several large plates. Let the rice dry out for about 1 to 2 hours before using it for fried rice."},{"@type":"HowToStep","position":3,"text":"Rice sticks to the pan very easily, so make sure to use a wok or pan that doesn’t have a sticky surface. I usually cook stir-fries in my seasoned carbon steel wok, but cast iron or nonstick pans work well, too. You might need to add a little more oil if things aren’t releasing easily."},{"@type":"HowToStep","position":4,"text":"Prepare the chicken:"},{"@type":"HowToStep","position":5,"text":"Chop the chicken into small 1/4-inch to 1/2-inch cubes. Sprinkle 1/2 teaspoon of salt over the chicken and mix to combine. Set the chicken aside for about 10 minutes (I usually use this time to chop all the vegetables)."},{"@type":"HowToStep","position":6,"text":"Scramble the egg:"},{"@type":"HowToStep","position":7,"text":"Heat a wok or large sauté pan over medium-high heat. Swirl in a tablespoon of oil and add the whisked eggs. Use a spatula to quickly scramble the eggs, breaking the curds into smaller pieces as they come together. Transfer the eggs to a plate."},{"@type":"HowToStep","position":8,"text":"Cook the chicken:"},{"@type":"HowToStep","position":9,"text":"Add another tablespoon of oil in the wok or pan. Add the chicken and cook for 4 to 5 minutes, stirring occasionally. Turn off the heat and transfer the cooked chicken to a plate."},{"@type":"HowToStep","position":10,"text":"Using your spatula, scrape off any chicken bits that are still stuck to the wok so they don't burn during the next step. You can also use paper towels to wipe down your wok or pan."},{"@type":"HowToStep","position":11,"text":"Cook the vegetables:"},{"@type":"HowToStep","position":12,"text":"Swirl 1 tablespoon of oil into the wok over medium-high heat. Add the diced onions and cook them for 1 minute, until they start to soften. Mix in the minced garlic and ginger and cook until fragrant, about 30 seconds. Add the diced carrots and cook for 2 minutes, stirring frequently. Add 1/2 teaspoon salt and the peas, and stir to incorporate."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Chicken Fried Rice من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Chicken Fried Rice إلى حوالي 32 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Chicken Fried Rice؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Chicken Fried Rice؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 371 سعرة حرارية و17 غرام بروتين."}},{"@type":"Question","name":"هل Chicken Fried Rice سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Chicken Fried Rice؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Chicken Thighs، Salt، Canola Oil، Egg، Onion."}}]}</script>
