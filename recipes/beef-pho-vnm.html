<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Beef pho","description":"وصفة Beef pho التقليدية","image":"https://www.themealdb.com/images/media/meals/pbzcrx1763765096.jpg","recipeCategory":"بحري","cookTime":"PT45M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"374 cal"},"recipeIngredient":["1 L Beef Stock","1 large Onion","1 Large Chopped Ginger","1 Cinnamon Stick","2 Star Anise","1 tsp Coriander Seeds","1/2 teaspoon Cloves","225g Sirloin steak","1 tsp Palm Sugar","1 tablespoon Fish Sauce"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Tip the beef stock along with 500ml of water into a large saucepan. Sit the onion and ginger in a frying pan over a high heat and char on all sides, around 3-5 mins (you can also do this under your grill). Once charred, add to the beef stock. In the same pan, toast the spices for 2-3 mins and once they begin to smell fragrant, add them to the beef stock as well. Bring the stock to the boil, then turn to a simmer and cook for 30mins before straining."},{"@type":"HowToStep","position":2,"text":"Meanwhile, cut the fat from the steak and wrap in cling film, then put into the freezer for 15 mins – this will make your steak really easy to slice! Slice it thinly, then cover with cling film again and pop into the fridge."},{"@type":"HowToStep","position":3,"text":"Taste the beef stock and use the palm sugar, fish sauce and soy to season. Cook the noodles according to package instructions and split between two bowls, topping each with the sliced beef. Bring the stock to the boil and then pour into the bowls (the heat will cook the beef). Top each with the spring onions, chilli slices and herbs. Serve with the lime wedges to squeeze over."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Beef pho من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Beef pho إلى حوالي 45 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Beef pho؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 4 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Beef pho؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 374 سعرة حرارية و19 غرام بروتين."}},{"@type":"Question","name":"هل Beef pho سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Beef pho؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Beef Stock، Onion، Ginger، Cinnamon Stick، Star Anise."}}]}</script>
