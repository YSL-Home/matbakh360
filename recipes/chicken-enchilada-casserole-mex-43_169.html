<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken Enchilada Casserole","description":"وصفة Chicken Enchilada Casserole التقليدية","image":"https://www.themealdb.com/images/media/meals/qtuwxu1468233098.jpg","recipeCategory":"سريع","cookTime":"PT30M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"368 cal"},"recipeIngredient":["14 oz jar Enchilada sauce","3 Cups shredded Monterey Jack cheese","6 corn tortillas","2 chicken breasts"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Cut each chicken breast in about 3 pieces, so that it cooks faster and put it in a small pot. Pour Enchilada sauce over it and cook covered on low to medium heat until chicken is cooked through, about 20 minutes. No water is needed, the chicken will cook in the Enchilada sauce. Make sure you stir occasionally so that it doesn't stick to the bottom."},{"@type":"HowToStep","position":2,"text":"Remove chicken from the pot and shred with two forks."},{"@type":"HowToStep","position":3,"text":"Preheat oven to 375 F degrees."},{"@type":"HowToStep","position":4,"text":"Start layering the casserole. Start with about ¼ cup of the leftover Enchilada sauce over the bottom of a baking dish. I used a longer baking dish, so that I can put 2 corn tortillas across. Place 2 tortillas on the bottom, top with ⅓ of the chicken and ⅓ of the remaining sauce. Sprinkle with ⅓ of the cheese and repeat starting with 2 more tortillas, then chicken, sauce, cheese. Repeat with last layer with the remaining ingredients, tortillas, chicken, sauce and cheese."},{"@type":"HowToStep","position":5,"text":"Bake for 20 to 30 minutes uncovered, until bubbly and cheese has melted and started to brown on top."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Chicken Enchilada Casserole من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Chicken Enchilada Casserole إلى حوالي 30 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Chicken Enchilada Casserole؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Chicken Enchilada Casserole؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 368 سعرة حرارية و21 غرام بروتين."}},{"@type":"Question","name":"هل Chicken Enchilada Casserole سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Chicken Enchilada Casserole؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 4 مكونات أساسية منها: Enchilada sauce، shredded Monterey Jack cheese، corn tortillas، chicken breasts."}}]}</script>
