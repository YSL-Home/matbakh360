<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Prawns with Romesco sauce","description":"وصفة Prawns with Romesco sauce التقليدية","image":"https://www.themealdb.com/images/media/meals/u03xhi1763308917.jpg","recipeCategory":"بحري","cookTime":"PT55M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"234 cal"},"recipeIngredient":["1 Red Pepper","3 Large Garlic Clove","1 large Red Chilli","1 large Tomato","10 Shelled Hazelnuts","10 Almonds","3 sprigs Parsley","1 sliced Bread","120ml Olive Oil","2 tblsp Red Wine Vinegar"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Prepare ahead - halve the pepper lengthways and remove the seeds and stalk. Line a grill pan with foil and put the pepper halves, skin side up, on the grill pan with the whole garlic cloves, chilli and tomato. Grill for 2 minutes, turn the tomato, then grill for a further 2 minutes. Remove the tomato with a large spoon, then peel, quarter and remove the seeds. Then chop the tomato roughly."},{"@type":"HowToStep","position":2,"text":"Continue grilling the pepper, chilli and garlic for 4-5 minutes, until the pepper and chilli skins have blackened and the garlic is starting to soften (the garlic skin will start to split when it is ready). When cool enough to handle, peel and halve the chilli, and scrape out and discard the seeds. Peel the pepper and roughly chop both the pepper and chilli."},{"@type":"HowToStep","position":3,"text":"Spread nuts over the foil and grill until toasted. Finely chop the nuts and parsley in a food processor. Tip into a small bowl."},{"@type":"HowToStep","position":4,"text":"Heat 3 tablespoons of oil in a frying pan, add the pepper, garlic and chilli and fry for 3 minutes. Tear up the bread and add to the pan, turning it in the oil until lightly browned. Pulse in food processor with the tomatoes, salt, vinegar and oil until roughly chopped. Tip into a bowl. Leave to cool and store in fridge for up to 3 days."},{"@type":"HowToStep","position":5,"text":"On the day add the nuts and parsley to the sauce and mix. Serve in a small bowl on a plate with the peeled prawns. Supply cocktail sticks for spearing the prawns."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Prawns with Romesco sauce من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Prawns with Romesco sauce إلى حوالي 55 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Prawns with Romesco sauce؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 4 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Prawns with Romesco sauce؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 234 سعرة حرارية و27 غرام بروتين."}},{"@type":"Question","name":"هل Prawns with Romesco sauce سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Prawns with Romesco sauce؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Red Pepper، Garlic Clove، Red Chilli، Tomato، Shelled Hazelnuts."}}]}</script>
