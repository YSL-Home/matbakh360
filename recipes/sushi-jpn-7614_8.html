<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Sushi","description":"وصفة Sushi التقليدية","image":"https://www.themealdb.com/images/media/meals/g046bb1663960946.jpg","recipeCategory":"ياباني","cookTime":"PT35M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"288 cal"},"recipeIngredient":["300ml Sushi Rice","100ml Rice wine","2 tbs Caster Sugar","3 tbs Mayonnaise","1 tbs Rice wine","1 tbs Soy Sauce","1 Cucumber"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"TO MAKE SUSHI ROLLS: Pat out some rice. Lay a nori sheet on the mat, shiny-side down. Dip your hands in the vinegared water, then pat handfuls of rice on top in a 1cm thick layer, leaving the furthest edge from you clear."},{"@type":"HowToStep","position":2,"text":"Spread over some Japanese mayonnaise. Use a spoon to spread out a thin layer of mayonnaise down the middle of the rice."},{"@type":"HowToStep","position":3,"text":"Add the filling. Get your child to top the mayonnaise with a line of their favourite fillings – here we’ve used tuna and cucumber."},{"@type":"HowToStep","position":4,"text":"Roll it up. Lift the edge of the mat over the rice, applying a little pressure to keep everything in a tight roll."},{"@type":"HowToStep","position":5,"text":"Stick down the sides like a stamp. When you get to the edge without any rice, brush with a little water and continue to roll into a tight roll."},{"@type":"HowToStep","position":6,"text":"Wrap in cling film. Remove the mat and roll tightly in cling film before a grown-up cuts the sushi into thick slices, then unravel the cling film."},{"@type":"HowToStep","position":7,"text":"TO MAKE PRESSED SUSHI: Layer over some smoked salmon. Line a loaf tin with cling film, then place a thin layer of smoked salmon inside on top of the cling film."},{"@type":"HowToStep","position":8,"text":"Cover with rice and press down. Press about 3cm of rice over the fish, fold the cling film over and press down as much as you can, using another tin if you have one."},{"@type":"HowToStep","position":9,"text":"Tip it out like a sandcastle. Turn block of sushi onto a chopping board. Get a grown-up to cut into fingers, then remove the cling film."},{"@type":"HowToStep","position":10,"text":"TO MAKE SUSHI BALLS: Choose your topping. Get a small square of cling film and place a topping, like half a prawn or a small piece of smoked salmon, on it. Use damp hands to roll walnut-sized balls of rice and place on the topping."},{"@type":"HowToStep","position":11,"text":"Make into tight balls. Bring the corners of the cling film together and tighten into balls by twisting it up, then unwrap and serve."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Sushi من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Sushi إلى حوالي 35 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Sushi؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 4 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Sushi؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 288 سعرة حرارية و16 غرام بروتين."}},{"@type":"Question","name":"هل Sushi سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Sushi؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 7 مكونات أساسية منها: Sushi Rice، Rice wine، Caster Sugar، Mayonnaise، Rice wine."}}]}</script>
