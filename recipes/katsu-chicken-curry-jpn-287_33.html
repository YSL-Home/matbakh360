<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Katsu Chicken curry","description":"وصفة Katsu Chicken curry التقليدية","image":"https://www.themealdb.com/images/media/meals/vwrpps1503068729.jpg","recipeCategory":"ياباني","cookTime":"PT48M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"438 cal"},"recipeIngredient":["4 pounded to 1cm thickness chicken breast","2 tablespoons plain flour","1 beaten egg","100g fine breadcrumbs","230ml frying vegetable oil","2 tablespoons sunflower oil","2 sliced onions","5 chopped cloves garlic","2 sliced carrot","2 tablespoons plain flour"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Prep:15min  ›  Cook:30min  ›  Ready in:45min"},{"@type":"HowToStep","position":2,"text":"For the curry sauce: Heat oil in medium non-stick saucepan, add onion and garlic and cook until softened. Stir in carrots and cook over low heat for 10 to 12 minutes."},{"@type":"HowToStep","position":3,"text":"Add flour and curry powder; cook for 1 minute. Gradually stir in stock until combined; add honey, soy sauce and bay leaf. Slowly bring to the boil."},{"@type":"HowToStep","position":4,"text":"Turn down heat and simmer for 20 minutes or until sauce thickens but is still of pouring consistency. Stir in garam masala. Pour the curry sauce through a sieve; return to saucepan and keep on low heat until ready to serve."},{"@type":"HowToStep","position":5,"text":"For the chicken: Season both sides of chicken breasts with salt and pepper. Place flour, egg and breadcrumbs in separate bowls and arrange in a row. Coat the chicken breasts in flour, then dip them into the egg, then coat in breadcrumbs, making sure you cover both sides."},{"@type":"HowToStep","position":6,"text":"Heat oil in large frying pan over medium-high heat. Place chicken into hot oil and cook until golden brown, about 3 or 4 minutes each side. Once cooked, place on kitchen paper to absorb excess oil."},{"@type":
