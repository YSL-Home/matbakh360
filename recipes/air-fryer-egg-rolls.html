<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Air Fryer Egg Rolls","description":"وصفة Air Fryer Egg Rolls التقليدية","image":"https://www.themealdb.com/images/media/meals/grhn401765687086.jpg","recipeCategory":"خبز","cookTime":"PT23M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"471 cal"},"recipeIngredient":["1 tablespoon Olive Oil","1 lb Ground Pork","1 clove peeled crushed Garlic","1 tablespoon Ginger","1 medium Carrots","3 chopped Scallions","3 Cups Cabbage","1 tablespoon Soy Sauce","1 tablespoon Rice Vinegar","12 Egg Roll Wrappers"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Alternative Pan Fry Method: If you don’t have access to an air fryer, you can make these egg rolls using a traditional pan fry method. Add enough oil to a medium skillet with high walls so the oil is about 1/2 inch up the side of the skillet. Heat oil on medium high heat until it reaches 350°F. Add egg rolls and fry for 3 to 4 minutes, flip, and fry for another 3 to 4 minutes until golden brown. Remove and let them drain and cool on a few paper towels."},{"@type":"HowToStep","position":2,"text":"Cook the filling:"},{"@type":"HowToStep","position":3,"text":"In a large skillet over medium heat, add the olive oil along with the ground pork or chicken. Break apart the meat with a spatula or wooden spoon as it cooks. Cook until the meat is cooked through, 6 to 8 minutes."},{"@type":"HowToStep","position":4,"text":"Add garlic, ginger, carrot, scallions, and cabbage. Continue to cook until cabbage wilts down and is soft, another 3 to 4 minutes, stirring regularly. Season the filling with soy sauce and rice wine vinegar, and take off the heat to cool. (This filling can be made in advance.)"},{"@type":"HowToStep","position":5,"text":"Assemble the egg rolls:"},{"@type":"HowToStep","position":6,"text":"Place a single egg roll wrapper on a dry surface with one point of the square facing you (like a diamond). Place about 1/4 cup of the egg roll filling mixture in the middle of the wrapper."},{"@type":"HowToStep","position":7,"text":"Dip your fingers in water and run around the edges of the wrapper. Then fold the edges of the wrapper over the center and start rolling the egg roll away from you to form a tight cylinder. Place on a plate and repeat until you are out of filling. You should get at least a dozen egg rolls."},{"@type":"HowToStep","position":8,"text":"Air fry the egg rolls:"},{"@type":"HowToStep","position":9,"text":"Place the egg rolls in the basket of your air fryer. Spray or brush them lightly with oil. Add as many as you can without stacking the egg rolls, making sure they don’t touch. Air needs to circulate around them. Brush the egg rolls lightly with oil."},{"@type":"HowToStep","position":10,"text":"Place the basket in the air fryer and turn the air fryer to 350°F. Cook for 6 to 7 minutes, then flip the egg rolls, spray or brush with oil a second time on the bottom side, and cook for another 4 to 5 minutes."},{"@type":"HowToStep","position":11,"text":"Finished egg rolls should be golden brown and crispy! Serve immediately."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Air Fryer Egg Rolls من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Air Fryer Egg Rolls إلى حوالي 23 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Air Fryer Egg Rolls؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Air Fryer Egg Rolls؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 471 سعرة حرارية و18 غرام بروتين."}},{"@type":"Question","name":"هل Air Fryer Egg Rolls سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Air Fryer Egg Rolls؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Olive Oil، Ground Pork، Garlic، Ginger، Carrots."}}]}</script>
