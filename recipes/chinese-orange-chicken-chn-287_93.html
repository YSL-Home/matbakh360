<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chinese Orange Chicken","description":"وصفة Chinese Orange Chicken التقليدية","image":"https://www.themealdb.com/images/media/meals/s73ytv1765567838.jpg","recipeCategory":"صيني","cookTime":"PT39M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"293 cal"},"recipeIngredient":["Zest of 1 Orange","1/4 cup Orange Juice","1/4 cup Soy Sauce","1/4 cup Water","1/3 cup Rice Vinegar","1 tablespoon Cornstarch","1 tablespoon Sesame Seed Oil","1/2 cup Sugar","650g Chicken Thighs","2 large Egg"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Make the orange sauce:"},{"@type":"HowToStep","position":2,"text":"Whisk together sauce ingredients in a medium bowl. Set aside."},{"@type":"HowToStep","position":3,"text":"Prep the chicken:"},{"@type":"HowToStep","position":4,"text":"Cut chicken into about 1-inch cubes. Whisk eggs with salt and black pepper in a bowl and add chicken. Stir together."},{"@type":"HowToStep","position":5,"text":"In a separate bowl, whisk together flour and cornstarch. Remove chicken from eggs with a slotted spoon or tongs, letting excess egg drain off, then transfer to cornstarch mixture and coat well."},{"@type":"HowToStep","position":6,"text":"Fry the chicken:"},{"@type":"HowToStep","position":7,"text":"Add oil to a large 10- to 12-inch skillet. Heat over medium-high heat until it reaches 350°F. If you don’t have a thermometer, you can also test the temperature by sprinkling in some flour. If the oil is hot enough, it should fizzle immediately."},{"@type":"HowToStep","position":8,"text":"Once oil is hot, fry the chicken in two batches. The oil might not completely cover the chicken—that’s okay. Cook for 3 to 4 minutes. Flip the chicken pieces and cook until the chicken is cooked through, about 3 to 4 more minutes. Total cook time is about 6 to 8 minutes."},{"@type":"HowToStep","position":9,"text":"Remove fried chicken cubes and transfer to a plate lined with paper towels, so the chicken can drain. Repeat until all the chicken is cooked."},{"@type":"HowToStep","position":10,"text":"Simmer the chicken in the sauce:"},{"@type":"HowToStep","position":11,"text":"Once chicken is done, pour out hot oil and wipe pan clean. Add a fresh tablespoon of oil along with chopped garlic and shallot. Cook for a minute and then add the sauce. Simmer the sauce until it starts to thicken."},{"@type":"HowToStep","position":12,"text":"Once the sauce is lightly bubbling, add fried chicken and toss together to coat. The sauce should continue to thicken and stick to the chicken. Let simmer for a minute or two more. Serve orange chicken over cooked white rice, garnished with sesame seeds and fresh scallions."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Chinese Orange Chicken من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Chinese Orange Chicken إلى حوالي 39 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Chinese Orange Chicken؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Chinese Orange Chicken؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 293 سعرة حرارية و33 غرام بروتين."}},{"@type":"Question","name":"هل Chinese Orange Chicken سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Chinese Orange Chicken؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Orange، Orange Juice، Soy Sauce، Water، Rice Vinegar."}}]}</script>
