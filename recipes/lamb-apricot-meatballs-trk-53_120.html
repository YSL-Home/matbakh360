<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Lamb & apricot meatballs","description":"وصفة Lamb & apricot meatballs التقليدية","image":"https://www.themealdb.com/images/media/meals/72fgzj1764109947.jpg","recipeCategory":"تركي","cookTime":"PT39M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"548 cal"},"recipeIngredient":["2 tablespoons Olive Oil","2 chopped Red Onions","4 Cloves Crushed Garlic","2 tsp Ground Cumin","2 tsp Ground Coriander","400g Tinned Tomatos","1/2 teaspoon Sugar","10g Mint","500g Lamb Mince","8 Dried Apricots"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat 2 tsp oil in a pan and soften the onions for 5 mins. Add the garlic and spices and cook for a few mins more. Spoon half the onion mixture into a bowl and set aside to cool. Add the tomatoes, sugar and seasoning to the remaining onions in the pan and simmer for about 10 mins until reduced."},{"@type":"HowToStep","position":2,"text":"Meanwhile, add the mint, lamb, apricots and breadcrumbs to the cooled onions, season and mix well with your hands. Shape into little meatballs."},{"@type":"HowToStep","position":3,"text":"Heat the rest of the oil in a non-stick pan and fry the meatballs until golden (in batches if you need to). Stir in the sauce with a splash of water and gently cook everything for a few mins until the meatballs are cooked through. Serve with pitta bread and salad."}]}</script>
