<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Shrimp With Snow Peas","description":"وصفة Shrimp With Snow Peas التقليدية","image":"https://www.themealdb.com/images/media/meals/fpl3mv1766433431.jpg","recipeCategory":"بحري","cookTime":"PT26M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"296 cal"},"recipeIngredient":["2 tsp Cornstarch","1 tablespoon Dry sherry","1/2 tsp Kosher Salt","1 lb Shrimp","2 tablespoons Peanut Oil","1 tablespoon Ground Ginger","3 cloves Chopped Garlic","1/2 lb Snow Peas","2 tsp Soy Sauce","1/4 cup Chicken Stock"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"You can also use sugar snap peas for this recipe. Save prep time by prepping the peas, ginger, and garlic while the shrimp is marinating."},{"@type":"HowToStep","position":2,"text":"Marinate the shrimp:"},{"@type":"HowToStep","position":3,"text":"Mix all marinade ingredients in a large bowl, then add the shrimp. Toss to coat. Let sit for 15 to 20 minutes while you prep the peas, ginger, and garlic."},{"@type":"HowToStep","position":4,"text":"Stir-fry the ginger and garlic:"},{"@type":"HowToStep","position":5,"text":"Heat a wok or large sauté pan over high heat for 1 minute. Add the peanut oil and let it get hot, about 30 seconds. Add the ginger and garlic and toss to combine. Stir-fry for about 30 seconds."},{"@type":"HowToStep","position":6,"text":"Add the shrimp, snow peas, soy sauce, stock:"},{"@type":"HowToStep","position":7,"text":"Add the shrimp and all the marinade to the pan (scrape out all the marinade with a rubber spatula). Add the snow peas, soy sauce and chicken stock. Stir-fry until the shrimp turns pink, about 2 minutes."},{"@type":"HowToStep","position":8,"text":"Add the scallions and finish with sesame oil:"},{"@type":"HowToStep","position":9,"text":"Add the scallions and stir-fry 1 more minute. Turn off the heat and add the sesame oil. Toss to combine once more and serve with steamed rice."}]}</script>
