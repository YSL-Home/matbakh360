<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Teriyaki Chicken Casserole","description":"وصفة Teriyaki Chicken Casserole التقليدية","image":"https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg","recipeCategory":"ياباني","cookTime":"PT38M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"627 cal"},"recipeIngredient":["3/4 cup soy sauce","1/2 cup water","1/4 cup brown sugar","1/2 teaspoon ground ginger","1/2 teaspoon minced garlic","4 Tablespoons cornstarch","2 chicken breasts","1 (12 oz.) stir-fry vegetables","3 cups brown rice"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Preheat oven to 350° F. Spray a 9x13-inch baking pan with non-stick spray."},{"@type":"HowToStep","position":2,"text":"Combine soy sauce, ½ cup water, brown sugar, ginger and garlic in a small saucepan and cover. Bring to a boil over medium heat. Remove lid and cook for one minute once boiling."},{"@type":"HowToStep","position":3,"text":"Meanwhile, stir together the corn starch and 2 tablespoons of water in a separate dish until smooth. Once sauce is boiling, add mixture to the saucepan and stir to combine. Cook until the sauce starts to thicken then remove from heat."},{"@type":"HowToStep","position":4,"text":"Place the chicken breasts in the prepared pan. Pour one cup of the sauce over top of chicken. Place chicken in oven and bake 35 minutes or until cooked through. Remove from oven and shred chicken in the dish using two forks."},{"@type":"HowToStep","position":5,"text":"*Meanwhile, steam or cook the vegetables according to package directions."},{"@type":"HowToStep","position":6,"text":"Add the cooked vegetables and rice to the casserole dish with the chicken. Add most of the remaining sauce, reserving a bit to drizzle over the top when serving. Gently toss everything together in the casserole dish until combined. Return to oven and cook 15 minutes. Remove from oven and let stand 5 minutes before serving. Drizzle each serving with remaining sauce. Enjoy!"}]}</script>
