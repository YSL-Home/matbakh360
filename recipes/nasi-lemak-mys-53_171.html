<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Nasi lemak","description":"وصفة Nasi lemak التقليدية","image":"https://www.themealdb.com/images/media/meals/wai9bw1619788844.jpg","recipeCategory":"بحري","cookTime":"PT24M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"395 cal"},"recipeIngredient":["2 cups Coconut Milk","2 cups Water","1/4 tsp Ginger Paste","1 Ginger","1 Bay Leaf","2 cups Rice","4 Eggs","1 Cucumber","1 cup Peanuts","4 oz Anchovy Fillet"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"In a medium saucepan over medium heat, stir together coconut milk, water, ground ginger, ginger root, salt, bay leaf, and rice. Cover, and bring to a boil. Reduce heat, and simmer for 20 to 30 minutes, or until done."},{"@type":"HowToStep","position":2,"text":"Place eggs in a saucepan, and cover with cold water. Bring water to a boil, and immediately remove from heat. Cover, and let eggs stand in hot water for 10 to 12 minutes. Remove eggs from hot water, cool, peel and slice in half. Slice cucumber."},{"@type":"HowToStep","position":3,"text":"Meanwhile, in a large skillet or wok, heat 1 cup vegetable oil over medium-high heat. Stir in peanuts and cook briefly, until lightly browned. Remove peanuts with a slotted spoon and place on paper towels to soak up excess grease. Return skillet to stove. Stir in the contents of one package anchovies; cook briefly, turning, until crisp. Remove with a slotted spoon and place on paper towels. Discard oil. Wipe out skillet."},{"@type":"HowToStep","position":4,"text":"Heat 2 tablespoons oil in the skillet. Stir in the onion, garlic, and shallots; cook until fragrant, about 1 or 2 minutes. Mix in the chile paste, and cook for 10 minutes, stirring occasionally. If the chile paste is too dry, add a small amount of water. Stir in remaining anchovies; cook for 5 minutes. Stir in salt, sugar, and tamarind juice; simmer until sauce is thick, about 5 minutes."},{"@type":"HowToStep","position":5,"text":"Serve the onion and garlic sauce over the warm rice, and top with peanuts, fried anchovies, cucumbers, and eggs."}]}</script>
