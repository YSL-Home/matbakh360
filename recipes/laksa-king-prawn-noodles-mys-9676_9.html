<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Laksa King Prawn Noodles","description":"وصفة Laksa King Prawn Noodles التقليدية","image":"https://www.themealdb.com/images/media/meals/rvypwy1503069308.jpg","recipeCategory":"بحري","cookTime":"PT59M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"273 cal"},"recipeIngredient":["1 tbsp Olive Oil","1 finely sliced Red Chilli","2 ½ tbsp Thai red curry paste","1 vegetable stock cube","400ml can coconut milk","2 tsp fish sauce","100g rice noodles","2 juice of 1, the other halved lime","150g king prawns","½ small pack coriander"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat the oil in a medium saucepan and add the chilli. Cook for 1 min, then add the curry paste, stir and cook for 1 min more. Dissolve the stock cube in a large jug in 700ml boiling water, then pour into the pan and stir to combine. Tip in the coconut milk and bring to the boil."},{"@type":"HowToStep","position":2,"text":"Add the fish sauce and a little seasoning. Toss in the noodles and cook for a further 3-4 mins until softening. Squeeze in the lime juice, add the prawns and cook through until warm, about 2-3 mins. Scatter over some of the coriander."},{"@type":"HowToStep","position":3,"text":"Serve in bowls with the remaining coriander and lime wedges on top for squeezing over."}]}</script>
