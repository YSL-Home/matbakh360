<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Churros","description":"وصفة Churros التقليدية","image":"https://www.themealdb.com/images/media/meals/nxnny61763250596.jpg","recipeCategory":"حلويات","cookTime":"PT58M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"421 cal"},"recipeIngredient":["50g Butter","1/2 teaspoon Vanilla Extract","250g Plain Flour","1 teaspoon Baking Powder","1 L Sunflower Oil","2 chopped Bread","200g Dark Chocolate","100 ml Double Cream","100 ml Milk","3  tablespoons Golden Syrup"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Boil the kettle, then measure 300ml boiling water into a jug and add the melted butter and vanilla extract. Sift the flour and baking powder into a big mixing bowl with a big pinch of salt. Make a well in the centre, then pour in the contents of the jug and very quickly beat into the flour with a wooden spoon until lump-free. Rest for 10-15 mins while you make the sauce."},{"@type":"HowToStep","position":2,"text":"Put all the sauce ingredients into a pan and gently melt together, stirring occasionally until you have a smooth shiny sauce. Keep warm on a low heat."},{"@type":"HowToStep","position":3,"text":"Fill a large deep saucepan one-third full of oil. Cooking with hot oil can be dangerous – before you start, read up on how to deep-fry safely to avoid accidents in the kitchen. Heat until a cube of bread browns in 45 seconds to 1 min. Cover a tray with kitchen paper and mix the caster sugar and cinnamon together."},{"@type":"HowToStep","position":4,"text":"Fit a star nozzle to a piping bag – 1.5-2cm wide is a good size. Fill with the rested dough, then pipe 2-3 strips directly into the pan, snipping off each dough strip with a pair of kitchen scissors. Fry until golden brown and crisp. Be very careful here – if air bubbles form in the churros they can explode, especially if the oil overheats or you use old flour. Cooking with hot oil can be dangerous – before you start, read up on how to deep-fry safely to avoid accidents in the kitchen. Keep children out of the kitchen and protect yourself by wearing long sleeves and eye protection, and keeping your face away from the pan."},{"@type":"HowToStep","position":5,"text":"Once the churros are crisp and golden brown, remove them from the oil with a slotted spoon and drain on the kitchen paper-lined tray. Carry on cooking the rest of the dough in batches, sprinkling the cooked churros with some cinnamon sugar as you go. When you’ve cooked all the churros, toss with any remaining cinnamon sugar and serve with the chocolate sauce, for dipping."},{"@type":"HowToStep","position":6,"text":"To see a video of how to prepare churros, take a look at our churros ice cream sandwich recipe."}]}</script>
