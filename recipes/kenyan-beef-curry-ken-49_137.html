<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Kenyan Beef Curry","description":"وصفة Kenyan Beef Curry التقليدية","image":"https://www.themealdb.com/images/media/meals/lqampv1762325397.jpg","recipeCategory":"كيني","cookTime":"PT41M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"572 cal"},"recipeIngredient":["4 cups Water","2 Lbs Sirloin Steak tips","4 Garlic Clove","2 teaspoons Ground Ginger","2 tblsp Oil","2 medium Red Onions","4 Tomato","2 tblsp Paprika","1/2 teaspoon Black Pepper","2 teaspoons Curry Powder"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Bring the 4 cups of water to a boil in a Dutch oven or soup pot. Add the beef, garlic, and ginger, and stir well. Bring to a gentle simmer, cover, and cook, stirring occasionally, for 20 minutes. If you get any foamy scum on the top, not to worry, simply spoon it away or stir it back in."},{"@type":"HowToStep","position":2,"text":"Remove from the heat, and drain, but reserve the excess water for later."},{"@type":"HowToStep","position":3,"text":"Return the pot or Dutch oven to medium heat with the 2 tablespoons of cooking oil. Once the oil is shimmering, add the onions and cook, stirring occasionally, until softened, 5 to 7 minutes."},{"@type":"HowToStep","position":4,"text":"Add the tomatoes to the onions, and continue cooking, stirring occasionally, until the tomatoes are falling apart, 3 to 5 minutes."},{"@type":"HowToStep","position":5,"text":"Add the drained beef to the tomato and onion mixture, and stir well. Continue cooking over medium heat for 5 minutes, stirring occasionally."},{"@type":"HowToStep","position":6,"text":"Add the paprika, pepper, curry powder, tomato paste, and salt to taste, and stir well."},{"@type":"HowToStep","position":7,"text":"Add back the excess water that was used for cooking the beef, along with enough extra water to cover. Bring to a boil, reduce heat, and simmer, uncovered, stirring occasionally, for about 1 hour, or until the meat is tender and the sauce is thickened. Add additional water if your beef curry begins to dry and stick, or if would like your curry to have more of a soupy consistency."},{"@type":"HowToStep","position":8,"text":"When the beef curry is ready, remove from the heat, give it a taste, and adjust the seasonings as desired. Garnish with fresh chilis and cilantro."}]}</script>
