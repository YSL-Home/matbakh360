<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Sweet and Sour Chicken","description":"وصفة Sweet and Sour Chicken التقليدية","image":"https://www.themealdb.com/images/media/meals/arzs741766434335.jpg","recipeCategory":"حلويات","cookTime":"PT20M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"548 cal"},"recipeIngredient":["1 lb Chicken Thighs","1 large Egg White","1 tsp Kosher Salt","2 tsp Cornstarch","10 oz Pineapple Chunks","1/4 cup Pineapple Juice","1/4 cup White Vinegar","1/4 cup Tomato Ketchup","3  tablespoons Brown Sugar","4 tsp Oil"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Coat the chicken with egg white:"},{"@type":"HowToStep","position":2,"text":"In a bowl, combine the chicken with the egg white, 1/2 teaspoon kosher salt, and cornstarch. Stir to coat the chicken evenly. Let sit for 15 minutes at room temperature or up to overnight in the refrigerator."},{"@type":"HowToStep","position":3,"text":"Make the sweet and sour sauce:"},{"@type":"HowToStep","position":4,"text":"Whisk together the pineapple juice, vinegar, ketchup, 1/2 teaspoon kosher salt, and brown sugar."},{"@type":"HowToStep","position":5,"text":"Stir-fry the chicken over high heat:"},{"@type":"HowToStep","position":6,"text":"Heat a large frying pan or wok over high heat until a bead of water instantly sizzles and evaporates. Pour in 1 tablespoon of cooking oil and swirl to coat. It's important that the pan is very hot."},{"@type":"HowToStep","position":7,"text":"Add the chicken and spread the pieces out in one layer. Let the chicken fry untouched for 1 minute, until the bottoms are browned."},{"@type":"HowToStep","position":8,"text":"Flip and fry the other side for 1 minute. The chicken should still be pinkish in the middle. Dish out the chicken onto a clean plate, leaving as much oil in the pan as possible."},{"@type":"HowToStep","position":9,"text":"Stir-fry the bell pepper and ginger:"},{"@type":"HowToStep","position":10,"text":"Reduce the heat to medium and add the remaining 1 teaspoon of cooking oil. Let the oil heat up before adding the bell pepper chunks and ginger. Fry for 1 minute."},{"@type":"HowToStep","position":11,"text":"Add the pineapple, sauce, and then, the chicken:"},{"@type":"HowToStep","position":12,"text":"Add the pineapple chunks and the sweet and sour sauce. Turn up the heat to high. When the sauce is simmering, add the chicken pieces back in."}]}</script>
