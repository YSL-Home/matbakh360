<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Turkish rice (vermicelli rice)","description":"وصفة Turkish rice (vermicelli rice) التقليدية","image":"https://www.themealdb.com/images/media/meals/xw1ruy1763786501.jpg","recipeCategory":"تركي","cookTime":"PT31M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"535 cal"},"recipeIngredient":["300g Rice","3  tablespoons Vegetable Oil","70g Vermicelli Pasta","30g Unsalted Butter","600ml Chicken Stock"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Pour the rice into a very large bowl under cold running water and carefully drain the water out of the bowl through a sieve. Repeat a few times until the water in the bowl is clear, then fill the bowl up with cold water and leave rice to soak for 10 mins while you cook the vermicelli."},{"@type":"HowToStep","position":2,"text":"Put the oil into a medium pan over medium heat. Add the vermicelli and stir continuously until the strands turn a rich golden brown, 2-3 mins. Remove from the heat, stir through the butter until it melts and allow the vermicelli to cool for 1-2 mins."},{"@type":"HowToStep","position":3,"text":"Drain the rice thoroughly through a sieve. Add the rice to the pan and stir well. Pour the hot stock into the pan, sprinkle in ½ tsp salt, stir well then return the pan to the hob over a high heat. Bring to the boil, then reduce the heat to the lowest it will go, put the lid on the pan and simmer for 7-9 mins. Remove the pan from the heat, cover with a couple of sheets of kitchen paper or a light tea towel and the pan lid, and let the rice sit in the pan for 10 mins. Fluff up with a fork before serving."}]}</script>
