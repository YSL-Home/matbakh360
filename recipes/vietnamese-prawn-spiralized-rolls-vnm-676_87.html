<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Vietnamese prawn spiralized rolls","description":"وصفة Vietnamese prawn spiralized rolls التقليدية","image":"https://www.themealdb.com/images/media/meals/9r2xrg1763771238.jpg","recipeCategory":"بحري","cookTime":"PT26M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"638 cal"},"recipeIngredient":["Juice of 1/2 Lime","2 tablespoons Rice Vinegar","1 tablespoon Palm Sugar","3  tablespoons Fish Sauce","1 chopped Birds-eye Chillies","6 Rice Paper Sheets","Small bunch Mint","Small bunch Coriander","12 King Prawns","1 large Carrots"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Mix all the ingredients for the dipping sauce along with 50ml water in a bowl and set aside to allow the sugar to dissolve and flavour to infuse."},{"@type":"HowToStep","position":2,"text":"To assemble the rolls, fill a wide bowl with warm water and grab a clean damp tea towel to work on. Dip a rice paper wrapper into the water for a few seconds until it softens then carefully place onto the tea towel."},{"@type":"HowToStep","position":3,"text":"Put a few mint and coriander leaves in the centre of the wrapper then top with two prawns and a small handful of the spiralized veg, which may need to be cut up if the spirals are too long."},{"@type":"HowToStep","position":4,"text":"Fold the sides of the wrapper into the centre, over the filling, then fold in the edges, so that the filling is completely encased, then tightly roll. Repeat until all of the wrappers and filling have been used. To serve, slice on a diagonal and eat with the dipping sauce."}]}</script>
