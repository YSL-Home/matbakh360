<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Thai Green Curry","description":"وصفة Thai Green Curry التقليدية","image":"https://www.themealdb.com/images/media/meals/sstssx1487349585.jpg","recipeCategory":"بحري","cookTime":"PT58M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"220 cal"},"recipeIngredient":["225g new Potatoes","100g green beans","1 tbsp sunflower oil","1 clove garlic","4 tsp Thai green curry paste","400ml coconut milk","2 tsp Thai fish sauce","1 tsp Sugar","450g boneless Chicken","2 fresh kaffir leaves lime"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put the potatoes in a pan of boiling water and cook for 5 minutes. Throw in the beans and cook for a further 3 minutes, by which time both should be just tender but not too soft. Drain and put to one side."},{"@type":"HowToStep","position":2,"text":"In a wok or large frying pan, heat the oil until very hot, then drop in the garlic and cook until golden, this should take only a few seconds. Don’t let it go very dark or it will spoil the taste. Spoon in the curry paste and stir it around for a few seconds to begin to cook the spices and release all the flavours. Next, pour in the coconut milk and let it come to a bubble."},{"@type":"HowToStep","position":3,"text":"Stir in the fish sauce and sugar, then the pieces of chicken. Turn the heat down to a simmer and cook, covered, for about 8 minutes until the chicken is cooked."},{"@type":"HowToStep","position":4,"text":"Tip in the potatoes and beans and let them warm through in the hot coconut milk, then add a lovely citrussy flavour by stirring in the shredded lime leaves (or lime zest). The basil leaves go in next, but only leave them briefly on the heat or they will quickly lose their brightness. Scatter with the lime garnish and serve immediately with boiled rice."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Thai Green Curry من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Thai Green Curry إلى حوالي 58 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Thai Green Curry؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Thai Green Curry؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 220 سعرة حرارية و33 غرام بروتين."}},{"@type":"Question","name":"هل Thai Green Curry سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Thai Green Curry؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Potatoes، green beans، sunflower oil، garlic، Thai green curry paste."}}]}</script>
