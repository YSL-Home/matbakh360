<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Home-made Mandazi","description":"وصفة Home-made Mandazi التقليدية","image":"https://www.themealdb.com/images/media/meals/thazgm1555350962.jpg","recipeCategory":"سريع","cookTime":"PT29M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"294 cal"},"recipeIngredient":["750g Self-raising Flour","6 tablespoons Sugar","2 Eggs","1 cup Milk"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"This is one recipe a lot of people have requested and I have tried to make it as simple as possible and I hope it will work for you. Make sure you use the right flour which is basically one with raising agents. Adjust the amount of sugar to your taste and try using different flavours to have variety whenever you have them."},{"@type":"HowToStep","position":2,"text":"You can use Coconut milk instead of regular milk, you can also add desiccated coconut to the dry flour or other spices like powdered cloves or cinnamon."},{"@type":"HowToStep","position":3,"text":"For “healthy looking” mandazis do not roll the dough too thin before frying and use the procedure I have indicated above."},{"@type":"HowToStep","position":4,"text":"Mix the flour,cinnamon and sugar in a suitable bowl."},{"@type":"HowToStep","position":5,"text":"In a separate bowl whisk the egg into the milk"},{"@type":"HowToStep","position":6,"text":"Make a well at the centre of the flour and add the milk and egg mixture and slowly mix to form a dough."},{"@type":"HowToStep","position":7,"text":"Knead the dough for 3-4 minutes or until it stops sticking to the sides of the bowl and you have a smooth surface."},{"@type":"HowToStep","position":8,"text":"Cover the dough with a damp cloth  and allow to rest for 15 minutes."},{"@type":"HowToStep","position":9,"text":"Roll the dough on a lightly floured surface into a 1cm thick piece."},{"@type":"HowToStep","position":10,"text":"Using a sharp small knife, cut the dough into the desired size setting aside ready for deep frying."},{"@type":"HowToStep","position":11,"text":"Heat your oil in a suitable pot and gently dip the mandazi pieces to cook until light brown on the first side then turn to cook on the second side."},{"@type":"HowToStep","position":12,"text":"Serve them warm or cold"}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Home-made Mandazi من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Home-made Mandazi إلى حوالي 29 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Home-made Mandazi؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 4 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Home-made Mandazi؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 294 سعرة حرارية و16 غرام بروتين."}},{"@type":"Question","name":"هل Home-made Mandazi سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Home-made Mandazi؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 4 مكونات أساسية منها: Self-raising Flour، Sugar، Eggs، Milk."}}]}</script>
