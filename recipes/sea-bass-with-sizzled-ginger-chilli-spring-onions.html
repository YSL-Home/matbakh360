<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Sea bass with sizzled ginger, chilli & spring onions","description":"وصفة Sea bass with sizzled ginger, chilli & spring onions التقليدية","image":"https://www.themealdb.com/images/media/meals/tqd7s21763780609.jpg","recipeCategory":"بحري","cookTime":"PT20M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"382 cal"},"recipeIngredient":["6 Sea Bass Fillets","3  tablespoons Sunflower Oil","Knob Ginger","3 sliced thinly Garlic Clove","3 Large Red Chilli","Bunch Spring Onions","1 tablespoon Soy Sauce"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Season 6 sea bass fillets with salt and pepper, then slash the skin 3 times."},{"@type":"HowToStep","position":2,"text":"Heat a heavy-based frying pan and add 1 tbsp sunflower oil."},{"@type":"HowToStep","position":3,"text":"Once hot, fry the sea bass fillets, skin-side down, for 5 mins or until the skin is very crisp and golden. The fish will be almost cooked through."},{"@type":"HowToStep","position":4,"text":"Turn over, cook for another 30 seconds - 1 minute, then transfer to a serving plate and keep warm. You’ll need to fry the sea bass fillets in 2 batches."},{"@type":"HowToStep","position":5,"text":"Heat 2 tbsp sunflower oil, then fry the large knob of peeled ginger, cut into matchsticks, 3 thinly sliced garlic cloves and 3 thinly shredded red chillies for about 2 mins until golden."},{"@type":"HowToStep","position":6,"text":"Take off the heat and toss in the bunch of shredded spring onions. Splash the fish with 1 tbsp soy sauce and spoon over the contents of the pan."}]}</script>
