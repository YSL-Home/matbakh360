<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Ham croquetas","description":"وصفة Ham croquetas التقليدية","image":"https://www.themealdb.com/images/media/meals/6dpa7m1763331105.jpg","recipeCategory":"سريع","cookTime":"PT23M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"640 cal"},"recipeIngredient":["75g Plain Flour","2 large Egg","75g Breadcrumbs","For frying Sunflower Oil","4 tbsp Extra Virgin Olive Oil","1/2 Leek","70g jamón ibérico","60g Plain Flour","75 ml Vegetable Stock","330ml Milk"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"To make the filling, heat the olive oil in a pan until it starts to shimmer. Add the leek and sauté until soft but not coloured. Stir in the ham with a wooden spoon, fry for 1 min, then stir in the flour and fry over a medium heat, stirring occasionally, until the mixture is golden but not burnt – this will take about 5 mins."},{"@type":"HowToStep","position":2,"text":"Meanwhile, combine the stock and milk in a small pan and heat until steaming but not boiling. Season with a few scrapes of nutmeg. Gradually add the liquid, a few tbsp at a time, stirring constantly."},{"@type":"HowToStep","position":3,"text":"Once you’ve incorporated all the milk stock, continue to cook the filling over a medium heat for about 10 mins or until it thickens and leaves the sides of the pan when you stir it."},{"@type":"HowToStep","position":4,"text":"Season with black pepper, taste and adjust the salt if necessary – the ham can be very salty to start with. The filling is now done: it has to be really thick because you don’t want the croquetas to turn into pancakes."},{"@type":"HowToStep","position":5,"text":"Smooth the mixture onto a baking tray (30 x 20cm is fine). Once it has stopped steaming, cover with cling film to stop it drying out. Leave to cool before putting it in the fridge for 1 hr."},{"@type":"HowToStep","position":6,"text":"When you're ready for the next stage, line up three bowls: the first filled with the flour, the second with beaten egg and the third with breadcrumbs. Take the ham mixture out of the fridge. Put a little bit of olive oil on your hands to make it easier to roll the croquetas."},{"@type":"HowToStep","position":7,"text":"Roll a spoonful of the mixture between your palms. The size and shape of the croquetas is up to you, but the easiest is a walnut-sized ball. Then begin coating as follows."},{"@type":"HowToStep","position":8,"text":"Dunk the croquetas into the flour – you want a dusting – followed by the egg, then the breadcrumbs. Put them on a tray and, when you’ve used up all the mixture, place in the fridge for 30 mins."},{"@type":"HowToStep","position":9,"text":"If you have a deep-fat fryer, heat the oil to 180C and fry for a couple of mins. If not, heat the oil in a deep, heavy-bottomed saucepan until it starts to shimmer. Then add 5-6 croquetas at a time and fry until golden all over. Once cooked, drain on kitchen paper and eat straight away."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Ham croquetas من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Ham croquetas إلى حوالي 23 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Ham croquetas؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Ham croquetas؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 640 سعرة حرارية و12 غرام بروتين."}},{"@type":"Question","name":"هل Ham croquetas سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Ham croquetas؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: Plain Flour، Egg، Breadcrumbs، Sunflower Oil، Extra Virgin Olive Oil."}}]}</script>
