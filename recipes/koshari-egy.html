<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Koshari","description":"وصفة Koshari التقليدية","image":"https://www.themealdb.com/images/media/meals/4er7mj1598733193.jpg","recipeCategory":"حلويات","cookTime":"PT35M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"456 cal"},"recipeIngredient":["1 1/2 cups Brown Lentils","1 1/2 cups Rice","1/2 tsp Coriander","2 cups Macaroni","Can Chickpeas","1 large Onion","Sprinking Salt","1/2 cup Vegetable Oil"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Cook the lentils. Bring lentils and 4 cups of water to a boil in a medium pot or saucepan over high heat. Reduce the heat to low and cook until lentils are just tender (15-17 minutes). Drain from water and season with a little salt. (Note: when the lentils are ready, they should not be fully cooked. They should be only par-cooked and still have a bite to them as they need to finish cooking with the rice)."},{"@type":"HowToStep","position":2,"text":"Now, for the rice. Drain the rice from its soaking water. Combine the par-cooked lentils and the rice in the saucepan over medium-high heat with 1 tbsp cooking oil, salt, pepper, and coriander. Cook for 3 minutes, stirring regularly. Add warm water to cover the rice and lentil mixture by about 1 1/2 inches (you’ll probably use about 3 cups of water here). Bring to a boil; the water should reduce a bit. Now cover and cook until all the liquid has been absorbed and both the rice and lentils are well cooked through (about 20 minutes).  Keep covered and undisturbed for 5 minutes or so."},{"@type":"HowToStep","position":3,"text":"Now make the pasta. While the rice and lentils are cooking, make the pasta according to package instructions by adding the elbow pasta to boiling water with a dash of salt and a little oil. Cook until the pasta is al dente. Drain."},{"@type":"HowToStep","position":4,"text":"Cover the chickpeas and warm in the microwave briefly before serving."},{"@type":"HowToStep","position":5,"text":"Make the crispy onion topping."},{"@type":"HowToStep","position":6,"text":"Sprinkle the onion rings with salt, then toss them in the flour to coat. Shake off excess flour."},{"@type":"HowToStep","position":7,"text":"In a large skillet, heat the cooking oil over medium-high heat, cook the onion rings, stirring often, until they turn a nice caramelized brown. Onions must be crispy, but not burned (15-20 minutes)."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Koshari من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Koshari إلى حوالي 35 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Koshari؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Koshari؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 456 سعرة حرارية و12 غرام بروتين."}},{"@type":"Question","name":"هل Koshari سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Koshari؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 8 مكونات أساسية منها: Brown Lentils، Rice، Coriander، Macaroni، Chickpeas."}}]}</script>
