<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Ful Medames","description":"وصفة Ful Medames التقليدية","image":"https://www.themealdb.com/images/media/meals/lvn2d51598732465.jpg","recipeCategory":"مصري","cookTime":"PT55M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"503 cal"},"recipeIngredient":["2 cups Broad Beans","1/3 cup Parsley","Dash Olive Oil","3 Lemons","4 Garlic Clove","Sprinking Cumin"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"As the cooking time varies depending on the quality and age of the beans, it is good to cook them in advance and to reheat them when you are ready to serve. Cook the drained beans in a fresh portion of unsalted water in a large saucepan with the lid on until tender, adding water to keep them covered, and salt when the beans have softened. They take 2–2 1/2 hours of gentle simmering. When the beans are soft, let the liquid reduce. It is usual to take out a ladle or two of the beans and to mash them with some of the cooking liquid, then stir this back into the beans. This is to thicken the sauce."},{"@type":"HowToStep","position":2,"text":"Serve the beans in soup bowls sprinkled with chopped parsley and accompanied by Arab bread."},{"@type":"HowToStep","position":3,"text":"Pass round the dressing ingredients for everyone to help themselves: a bottle of extra-virgin olive oil, the quartered lemons, salt and pepper, a little saucer with the crushed garlic, one with chili-pepper flakes, and one with ground cumin."},{"@type":"HowToStep","position":4,"text":"The beans are eaten gently crushed with the fork, so that they absorb the dressing."},{"@type":"HowToStep","position":5,"text":"Optional Garnishes"},{"@type":"HowToStep","position":6,"text":"Peel hard-boiled eggs—1 per person—to cut up in the bowl with the beans."},{"@type":"HowToStep","position":7,"text":"Top the beans with a chopped cucumber-and-tomato salad and thinly sliced mild onions or scallions. Otherwise, pass round a good bunch of scallions and quartered tomatoes and cucumbers cut into sticks."},{"@type":"HowToStep","position":8,"text":"Serve with tahina cream sauce (page 65) or salad (page 67), with pickles and sliced onions soaked in vinegar for 30 minutes."},{"@type":"HowToStep","position":9,"text":"Another way of serving ful medames is smothered in a garlicky tomato sauce (see page 464)."},{"@type":"HowToStep","position":10,"text":"In Syria and Lebanon, they eat ful medames with yogurt or feta cheese, olives, and small cucumbers."},{"@type":"HowToStep","position":11,"text":"A traditional way of thickening the sauce is to throw a handful of red lentils (1/4 cup) into the water at the start of the cooking."},{"@type":"HowToStep","position":12,"text":"In Iraq, large brown beans are used instead of the small Egyptian ones, in a dish called badkila, which is also sold for breakfast in the street."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Ful Medames من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Ful Medames إلى حوالي 55 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Ful Medames؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 5 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Ful Medames؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 503 سعرة حرارية و26 غرام بروتين."}},{"@type":"Question","name":"هل Ful Medames سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Ful Medames؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 6 مكونات أساسية منها: Broad Beans، Parsley، Olive Oil، Lemons، Garlic Clove."}}]}</script>
