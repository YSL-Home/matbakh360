<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Feteer Meshaltet","description":"وصفة Feteer Meshaltet التقليدية","image":"https://www.themealdb.com/images/media/meals/9f4z6v1598734293.jpg","recipeCategory":"مصري","cookTime":"PT46M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"459 cal"},"recipeIngredient":["4 cups Flour","1 1/2 cups Water","1/4 tsp Salt","1 cup Unsalted Butter","1/4 cup Olive Oil"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Mix the flour and salt then pour one cup of water and start kneading."},{"@type":"HowToStep","position":2,"text":"If you feel the dough is still not coming together or too dry, gradually add the remaining water until you get a dough that is very elastic so that when you pull it and it won’t be torn."},{"@type":"HowToStep","position":3,"text":"Let the dough rest for just 10 minutes then divide the dough into 6-8 balls depending on the size you want for your feteer."},{"@type":"HowToStep","position":4,"text":"Warm up the butter/ghee or oil you are using and pour into a deep bowl."},{"@type":"HowToStep","position":5,"text":"Immerse the dough balls into the warm butter. Let it rest for 15 to 20 minutes."},{"@type":"HowToStep","position":6,"text":"Preheat oven to 550F."},{"@type":"HowToStep","position":7,"text":"Stretch the first ball with your hands on a clean countertop. Stretch it as thin as you can, the goal here is to see your countertop through the dough."},{"@type":"HowToStep","position":8,"text":"Fold the dough over itself to form a square brushing in between folds with the butter mixture."},{"@type":"HowToStep","position":9,"text":"Set aside and start making the next ball."},{"@type":"HowToStep","position":10,"text":"Stretch the second one thin as we have done for the first ball."},{"@type":"HowToStep","position":11,"text":"Place the previous one on the middle seam side down. Fold the outer one over brushing with more butter mixture as you fold. Set aside."},{"@type":"HowToStep","position":12,"text":"Keep doing this for the third and fourth balls. Now we have one ready, place on a 10 inch baking/pie dish seam side down and brush the top with more butter."}]}</script>
