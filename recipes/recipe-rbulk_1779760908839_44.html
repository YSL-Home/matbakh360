<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Shawarma","description":"وصفة Shawarma التقليدية","image":"https://www.themealdb.com/images/media/meals/kcv6hj1598733479.jpg","recipeCategory":"مصري","cookTime":"PT50M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"648 cal"},"recipeIngredient":["1 kg Chicken Thighs","1 tbs Coriander","1 tbs Cumin","1 tbs Cardamom","1 tsp Cayenne Pepper","2 tsp Paprika","2 tbs Lemon Juice","3 tbs Olive Oil","1 cup Greek Yogurt","1 Garlic Clove"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Combine the marinade ingredients in a large ziplock bag (or bowl)."},{"@type":"HowToStep","position":2,"text":"Add the chicken and use your hands to make sure each piece is coated. If using a ziplock bag, I find it convenient to close the bag then massage the bag to disperse the rub all over each chicken piece."},{"@type":"HowToStep","position":3,"text":"Marinate overnight or up to 24 hours."},{"@type":"HowToStep","position":4,"text":"Combine the Yoghurt Sauce ingredients in a bowl and mix. Cover and put in the fridge until required (it will last for 3 days in the fridge)."},{"@type":"HowToStep","position":5,"text":"Heat grill/BBQ (or large heavy based pan on stove) on medium high. You should not need to oil it because the marinade has oil in it and also thigh fillets have fat. But if you are worried then oil your hotplate/grill. (See notes for baking)"},{"@type":"HowToStep","position":6,"text":"Place chicken on the grill and cook the first side for 4 to 5 minutes until nicely charred, then turn and cook the other side for 3 to 4 minutes (the 2nd side takes less time)."},{"@type":"HowToStep","position":7,"text":"Remove chicken from the grill and cover loosely with foil. Set aside to rest for 5 minutes."},{"@type":"HowToStep","position":8,"text":"Slice chicken and pile onto platter alongside flatbreads, Salad and the Yoghurt Sauce."},{"@type":"HowToStep","position":9,"text":"To make a wrap, get a piece of flatbread and smear with Yoghurt Sauce. Top with a bit of lettuce and tomato and Chicken Shawarma. Roll up and enjoy!"}]}</script>
