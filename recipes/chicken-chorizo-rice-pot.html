<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken & chorizo rice pot","description":"وصفة Chicken & chorizo rice pot التقليدية","image":"https://www.themealdb.com/images/media/meals/fk80jp1763280767.jpg","recipeCategory":"إسباني","cookTime":"PT33M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"337 cal"},"recipeIngredient":["1 tblsp Oil","1 whole Chicken","1 Large Chopped Onion","1 chopped Red Pepper","3 Cloves Crushed Garlic","225g Chorizo","1 tblsp Tomato Puree","1 tablespoon chopped Thyme","150ml White Wine","800ml Chicken Stock"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat the oil in a large flameproof casserole dish and brown the chicken pieces on all sides – you may have to do this in batches. Remove from the dish and put to one side."},{"@type":"HowToStep","position":2,"text":"Lower the heat, add the onion and pepper, and gently cook for 10 mins until softened. Add the garlic and chorizo, and cook for a further 2 mins until the chorizo has released some of its oils into the dish. Stir in the tomato purée and cook for 1 min more."},{"@type":"HowToStep","position":3,"text":"Return the chicken pieces to the dish along with the thyme, white wine and stock. Bring the liquid to a boil, cover the dish with a tight-fitting lid and lower the heat. Cook for 30 mins."},{"@type":"HowToStep","position":4,"text":"Tip in the rice and stir everything together. Cover, set over a low heat and cook for a further 15 mins, or until the rice is cooked and has absorbed most of the cooking liquid. Remove from the heat and leave the dish to sit for 10 mins to absorb any remaining liquid. Season to taste and scatter with parsley to serve."}]}</script>
