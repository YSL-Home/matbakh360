<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Tonkatsu pork","description":"وصفة Tonkatsu pork التقليدية","image":"https://www.themealdb.com/images/media/meals/lwsnkl1604181187.jpg","recipeCategory":"بحري","cookTime":"PT42M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"597 cal"},"recipeIngredient":["4 Pork Chops","100g Flour","2 Beaten Eggs","100g Breadcrumbs","Fry Vegetable Oil","2 tbs Tomato Ketchup","2 tbs Worcestershire Sauce","1 tbs Oyster Sauce","2 tblsp Caster Sugar"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Remove the large piece of fat on the edge of each pork loin, then bash each of the loins between two pieces of baking parchment until around 1cm in thickness – you can do this using a meat tenderiser or a rolling pin. Once bashed, use your hands to reshape the meat to its original shape and thickness – this step will ensure the meat is as succulent as possible."},{"@type":"HowToStep","position":2,"text":"Put the flour, eggs and panko breadcrumbs into three separate wide-rimmed bowls. Season the meat, then dip first in the flour, followed by the eggs, then the breadcrumbs."},{"@type":"HowToStep","position":3,"text":"In a large frying or sauté pan, add enough oil to come 2cm up the side of the pan. Heat the oil to 180C – if you don’t have a thermometer, drop a bit of panko into the oil and if it sinks a little then starts to fry, the oil is ready. Add two pork chops and cook for 1 min 30 secs on each side, then remove and leave to rest on a wire rack for 5 mins. Repeat with the remaining pork chops."},{"@type":"HowToStep","position":4,"text":"While the pork is resting, make the sauce by whisking the ingredients together, adding a splash of water if it’s particularly thick. Slice the tonkatsu and serve drizzled with the sauce."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Tonkatsu pork من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Tonkatsu pork إلى حوالي 42 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Tonkatsu pork؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Tonkatsu pork؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 597 سعرة حرارية و13 غرام بروتين."}},{"@type":"Question","name":"هل Tonkatsu pork سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Tonkatsu pork؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 9 مكونات أساسية منها: Pork Chops، Flour، Eggs، Breadcrumbs، Vegetable Oil."}}]}</script>
