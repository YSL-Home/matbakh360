<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Prawn stir-fry","description":"وصفة Prawn stir-fry التقليدية","image":"https://www.themealdb.com/images/media/meals/96lt871763480970.jpg","recipeCategory":"بحري","cookTime":"PT23M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"379 cal"},"recipeIngredient":["200g Raw tiger prawns","1 chopped Green Chilli","3 Cloves Crushed Garlic","1  bunch Coriander","1 tblsp Caster Sugar","Juice of 1 Lime","3 tbsp Fish Sauce","2 tablespoons Ground Nut Oil","3cm piece Ginger","8 slices Spring Onions"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put the prawns in a bowl. Put the chilli, garlic, coriander stalks (snip these up using scissors first) and caster sugar in a spice grinder or small food processor and whizz together. Add half of the lime juice and the fish sauce, then pour this over the prawns."},{"@type":"HowToStep","position":2,"text":"Heat 1 tbsp oil in a wok, add the ginger and spring onions and fry for 1 min. Add the red pepper and fry for 1 min, until the pepper starts to soften. Add the water chestnuts and bean sprouts, and toss together until the bean sprouts start to wilt. Add the soy sauce and a really good grind of black pepper, then tip the lot into a serving dish."},{"@type":"HowToStep","position":3,"text":"Heat the remaining oil in the wok and add the prawns, lifting them out of their juices. Toss for 1-2 mins until they turn pink, add the marinade and swirl the wok quickly, then tip the lot onto the veg. Snip over the coriander leaves and sprinkle on the remaining lime. Serves over noodles with extra lime for squeezing over."}]}</script>
