<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Singapore Noodles with Shrimp","description":"وصفة Singapore Noodles with Shrimp التقليدية","image":"https://www.themealdb.com/images/media/meals/f3cxnc1765656994.jpg","recipeCategory":"بحري","cookTime":"PT33M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"408 cal"},"recipeIngredient":["2 tsp Sesame Seed Oil","2 tablespoons Soy Sauce","2 tablespoons Seasoned Rice Vinegar","6 oz Vermicelli Rice Noodles","2 large Egg","2 tblsp Ground Ginger","1 clove finely chopped Garlic","2 Carrots","1 sliced Jalapeno","1/2 Onion"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"For the sweet onion, look for Vidalia, OSO Sweet, or Walla Walla. The super-sweet varieties are more suited to this stir-fry because at the end of cooking, the onion still has a slight crunch."},{"@type":"HowToStep","position":2,"text":"In a bowl, combine the sesame oil, soy sauce, and rice vinegar."},{"@type":"HowToStep","position":3,"text":"Cook the rice noodles:"},{"@type":"HowToStep","position":4,"text":"Bring a large saucepan of water to a boil, add the noodles, and use tongs to turn them so they are submerged. Cook for 2 minutes, or until they are tender but still have some bite (they will cook a little more once you add them to the skillet)."},{"@type":"HowToStep","position":5,"text":"Drain, rinse with cold water, and use scissors to snip the noodles several times to break them up into shorter lengths."},{"@type":"HowToStep","position":6,"text":"Scramble the eggs:"},{"@type":"HowToStep","position":7,"text":"In a small bowl whisk together the eggs. Heat the skillet or Dutch oven over medium heat. Add 1 tablespoon of the peanut or canola oil. Add the eggs and scramble them for 2 minutes, or until they form large, soft curds. Transfer them from the pan to a plate or bowl."},{"@type":"HowToStep","position":8,"text":"Cook the vegetables:"},{"@type":"HowToStep","position":9,"text":"Add 1 tablespoon of the remaining oil to the pan. When it is hot, add the ginger, garlic, carrots, jalapeño, onion, and salt. Cook, stirring constantly, for 2 minutes or until the vegetables start to soften."},{"@type":"HowToStep","position":10,"text":"Add the remaining ingredients:"},{"@type":"HowToStep","position":11,"text":"Sprinkle the vegetable mixture with the remaining 1 tablespoon peanut or canola oil. When the oil is hot, add the ham, cabbage, scallions, red pepper, and curry powder to the pan. Cook, stirring constantly, for 1 minute."},{"@type":"HowToStep","position":12,"text":"Add the shrimp and cook, stirring, for 3 more minutes or until the shrimp are bright pink and cooked through."}]}</script>
