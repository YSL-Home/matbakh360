<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cajun spiced fish tacos","description":"وصفة Cajun spiced fish tacos التقليدية","image":"https://www.themealdb.com/images/media/meals/uvuyxu1503067369.jpg","recipeCategory":"بحري","cookTime":"PT34M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"234 cal"},"recipeIngredient":["2 tbsp cajun","1 tsp cayenne pepper","4 fillets white fish","1 tsp vegetable oil","8 flour tortilla","1 sliced avocado","2 shredded little gem lettuce","4 shredded Spring Onions","1 x 300ml salsa","1 pot sour cream"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Cooking in a cajun spice and cayenne pepper marinade makes this fish super succulent and flavoursome. Top with a zesty dressing and serve in a tortilla for a quick, fuss-free main that's delightfully summery."},{"@type":"HowToStep","position":2,"text":"On a large plate, mix the cajun spice and cayenne pepper with a little seasoning and use to coat the fish all over."},{"@type":"HowToStep","position":3,"text":"Heat a little oil in a frying pan, add in the fish and cook over a medium heat until golden. Reduce the heat and continue frying until the fish is cooked through, about 10 minutes. Cook in batches if you don’t have enough room in the pan."},{"@type":"HowToStep","position":4,"text":"Meanwhile, prepare the dressing by combining all the ingredients with a little seasoning."},{"@type":"HowToStep","position":5,"text":"Soften the tortillas by heating in the microwave for 5-10 seconds. Pile high with the avocado, lettuce and spring onion, add a spoonful of salsa, top with large flakes of fish and drizzle over the dressing."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Cajun spiced fish tacos من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Cajun spiced fish tacos إلى حوالي 34 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Cajun spiced fish tacos؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Cajun spiced fish tacos؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 234 سعرة حرارية و25 غرام بروتين."}},{"@type":"Question","name":"هل Cajun spiced fish tacos سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة صعبة وتحتاج خبرة."}},{"@type":"Question","name":"ما هي مكونات Cajun spiced fish tacos؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: cajun، cayenne pepper، white fish، vegetable oil، flour tortilla."}}]}</script>
