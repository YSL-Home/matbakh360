<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Braised Beef Chilli","description":"وصفة Braised Beef Chilli التقليدية","image":"https://www.themealdb.com/images/media/meals/uuqvwu1504629254.jpg","recipeCategory":"مكسيكي","cookTime":"PT38M","recipeYield":"5","nutrition":{"@type":"NutritionInformation","calories":"508 cal"},"recipeIngredient":["1kg Beef","3 Onions","4 cloves Garlic","Dash Olive oil","300g Chorizo","2 tsp Cumin","2 tsp Allspice","1 tsp Cloves","1 large Cinnamon stick","3 Bay Leaves"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Preheat the oven to 120C/225F/gas mark 1."},{"@type":"HowToStep","position":2,"text":"Take the meat out of the fridge to de-chill. Pulse the onions and garlic in a food processor until finely chopped. Heat 2 tbsp olive oil in a large casserole and sear the meat on all sides until golden."},{"@type":"HowToStep","position":3,"text":"Set to one side and add another small slug of oil to brown the chorizo. Remove and add the onion and garlic, spices, herbs and chillies then cook until soft in the chorizo oil. Season with salt and pepper and add the vinegar, tomatoes, ketchup and sugar."},{"@type":"HowToStep","position":4,"text":"Put all the meat back into the pot with 400ml water (or red wine if you prefer), bring up to a simmer and cook, covered, in the low oven."},{"@type":"HowToStep","position":5,"text":"After 2 hours, check the meat and add the beans. Cook for a further hour and just before serving, pull the meat apart with a pair of forks."}]}</script>
