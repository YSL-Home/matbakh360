<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Salmon Prawn Risotto","description":"وصفة Salmon Prawn Risotto التقليدية","image":"https://www.themealdb.com/images/media/meals/xxrxux1503070723.jpg","recipeCategory":"بحري","cookTime":"PT56M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"514 cal"},"recipeIngredient":["50g/2oz butter","1 finely chopped onion","150g rice","125ml white wine","1 litre hot vegetable stock","The juice and zest of one lemon","240g large King Prawns","150g salmon","100g tips blanched briefly in boiling water asparagus","ground black pepper"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Melt the butter in a thick-based pan and gently cook the onion without colour until it is soft."},{"@type":"HowToStep","position":2,"text":"Add the rice and stir to coat all the grains in the butter"},{"@type":"HowToStep","position":3,"text":"Add the wine and cook gently stirring until it is absorbed"},{"@type":"HowToStep","position":4,"text":"Gradually add the hot stock, stirring until each addition is absorbed. Keep stirring until the rice is tender"},{"@type":"HowToStep","position":5,"text":"Season with the lemon juice and zest, and pepper to taste. (there will probably be sufficient saltiness from the salmon to not need to add salt) Stir gently to heat through"},{"@type":"HowToStep","position":6,"text":"Serve scattered with the Parmesan and seasonal vegetables."},{"@type":"HowToStep","position":7,"text":"Grill the salmon and gently place onto the risotto with the prawns and asparagus"}]}</script>
