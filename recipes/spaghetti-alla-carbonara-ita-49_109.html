<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Spaghetti alla Carbonara","description":"وصفة Spaghetti alla Carbonara التقليدية","image":"https://www.themealdb.com/images/media/meals/llcbn01574260722.jpg","recipeCategory":"إيطالي","cookTime":"PT44M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"453 cal"},"recipeIngredient":["320g Spaghetti","6 Egg Yolks","As required Salt","150g Bacon","50g Pecorino","As required Black Pepper"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put a large saucepan of water on to boil."},{"@type":"HowToStep","position":2,"text":"Finely chop the 100g pancetta, having first removed any rind. Finely grate 50g pecorino cheese and 50g parmesan and mix them together."},{"@type":"HowToStep","position":3,"text":"Beat the 3 large eggs in a medium bowl and season with a little freshly grated black pepper. Set everything aside."},{"@type":"HowToStep","position":4,"text":"Add 1 tsp salt to the boiling water, add 350g spaghetti and when the water comes back to the boil, cook at a constant simmer, covered, for 10 minutes or until al dente (just cooked)."},{"@type":"HowToStep","position":5,"text":"Squash 2 peeled plump garlic cloves with the blade of a knife, just to bruise it."},{"@type":"HowToStep","position":6,"text":"While the spaghetti is cooking, fry the pancetta with the garlic. Drop 50g unsalted butter into a large frying pan or wok and, as soon as the butter has melted, tip in the pancetta and garlic."},{"@type":"HowToStep","position":7,"text":"Leave to cook on a medium heat for about 5 minutes, stirring often, until the pancetta is golden and crisp. The garlic has now imparted its flavour, so take it out with a slotted spoon and discard."},{"@type":"HowToStep","position":8,"text":"Keep the heat under the pancetta on low. When the pasta is ready, lift it from the water with a pasta fork or tongs and put it in the frying pan with the pancetta. Don’t worry if a little water drops in the pan as well (you want this to happen) and don’t throw the pasta water away yet."},{"@type":"HowToStep","position":9,"text":"Mix most of the cheese in with the eggs, keeping a small handful back for sprinkling over later."},{"@type":"HowToStep","position":10,"text":"Take the pan of spaghetti and pancetta off the heat. Now quickly pour in the eggs and cheese. Using the tongs or a long fork, lift up the spaghetti so it mixes easily with the egg mixture, which thickens but doesn’t scramble, and everything is coated."},{"@type":"HowToStep","position":11,"text":"Add extra pasta cooking water to keep it saucy (several tablespoons should do it). You don’t want it wet, just moist. Season with a little salt, if needed."},{"@type":"HowToStep","position":12,"text":"Use a long-pronged fork to twist the pasta on to the serving plate or bowl. Serve immediately with a little sprinkling of the remaining cheese and a grating of black pepper. If the dish does get a little dry before serving, splash in some more hot pasta water and the glossy sauciness will be revived."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Spaghetti alla Carbonara من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Spaghetti alla Carbonara إلى حوالي 44 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Spaghetti alla Carbonara؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 2 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Spaghetti alla Carbonara؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 453 سعرة حرارية و22 غرام بروتين."}},{"@type":"Question","name":"هل Spaghetti alla Carbonara سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة متوسطة الصعوبة."}},{"@type":"Question","name":"ما هي مكونات Spaghetti alla Carbonara؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 6 مكونات أساسية منها: Spaghetti، Egg Yolks، Salt، Bacon، Pecorino."}}]}</script>
