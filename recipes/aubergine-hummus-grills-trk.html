<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Aubergine & hummus grills","description":"وصفة Aubergine & hummus grills التقليدية","image":"https://www.themealdb.com/images/media/meals/zub3s91764110535.jpg","recipeCategory":"تركي","cookTime":"PT57M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"634 cal"},"recipeIngredient":["2 Aubergine","2 tablespoons Vegetable Oil","3 sliced thinly Bread","300g Hummus","100g Walnuts","40g Parsley","200g Cherry Tomatoes","Juice of 1/2 Lemon","Splash Extra Virgin Olive Oil"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Lay the aubergine out in one layer on a large baking sheet. Brush sparingly with vegetable oil, then season generously. Grill for 15 mins, turning twice and brushing with oil until the slices are softened and cooked through. Meanwhile, whizz the bread into crumbs. Add 2 tsp oil and whizz briefly again, to coat."},{"@type":"HowToStep","position":2,"text":"Spread a couple of tsps of hummus on top of each slice of aubergine. Tip the breadcrumbs onto a large plate, then press the hummus side of the aubergines into the crumbs to coat. Grill again, crumb-side up, for about 3 mins until golden."},{"@type":"HowToStep","position":3,"text":"Toss the walnuts, parsley and cherry tomatoes in a bowl, season, then add the lemon juice and olive oil and toss again. Serve the grills with the salad, a dollop more hummus and some pitta bread."}]}</script>
