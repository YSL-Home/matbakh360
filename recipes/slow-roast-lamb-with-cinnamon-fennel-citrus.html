<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Slow-roast lamb with cinnamon, fennel & citrus","description":"وصفة Slow-roast lamb with cinnamon, fennel & citrus التقليدية","image":"https://www.themealdb.com/images/media/meals/gr4lo51763791826.jpg","recipeCategory":"سريع","cookTime":"PT25M","recipeYield":"2","nutrition":{"@type":"NutritionInformation","calories":"293 cal"},"recipeIngredient":["1 Lamb Leg","Zest and juice of 1 Lemon","4 tablespoons Olive Oil","2 tablespoons Clear Honey","1 tablespoon Cinnamon","1 tablespoon Fennel Seeds","1 tablespoon Ground Cumin","3 Cloves Crushed Garlic"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put the lamb into a large food bag with all the juice and marinate overnight."},{"@type":"HowToStep","position":2,"text":"The next day, take the lamb out of the fridge 1 hr before you want to cook it. Heat oven to 220C/200C fan/gas 7. Take the lamb out of the marinade (reserve remaining marinade) and pat dry. Rub with half the oil and roast for 15-20 mins until browned. Remove lamb and reduce oven to 160C/140C fan/gas 3."},{"@type":"HowToStep","position":3,"text":"Mix the zests, remaining oil, honey, spices and garlic with plenty of seasoning. Lay a large sheet of baking parchment on a large sheet of foil. Sit the lamb leg on top, rub all over with the paste and pull up the sides of the foil. Drizzle marinade into base, and scrunch foil to seal."},{"@type":"HowToStep","position":4,"text":"Roast for 4 hrs, until very tender. Rest, still wrapped, for 30 mins. Unwrap and serve with juices."}]}</script>
