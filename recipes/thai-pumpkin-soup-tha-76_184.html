<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Thai pumpkin soup","description":"وصفة Thai pumpkin soup التقليدية","image":"https://www.themealdb.com/images/media/meals/1brbso1763585098.jpg","recipeCategory":"تايلاندي","cookTime":"PT47M","recipeYield":"4","nutrition":{"@type":"NutritionInformation","calories":"432 cal"},"recipeIngredient":["1.5kg Pumpkin","4 tsp Sunflower Oil","1 sliced Onion","1 tbsp grated Ginger","1 Lemongrass","4 tablespoons Thai Red Curry Paste","400ml Coconut Milk","800ml Vegetable Stock","To taste Lime juice","To taste Sugar"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Heat oven to 200C/180C fan/gas 6. Toss the pumpkin or squash in a roasting tin with half the oil and seasoning, then roast for 30 mins until golden and tender."},{"@type":"HowToStep","position":2,"text":"Meanwhile, put the remaining oil in a pan with the onion, ginger and lemongrass. Gently cook for 8-10 mins until softened. Stir in the curry paste for 1 min, followed by the roasted pumpkin, all but 3 tbsp of the coconut milk and the stock. Bring to a simmer, cook for 5 mins, then fish out the lemongrass. Cool for a few mins, then whizz until smooth with a hand blender, or in a large blender in batches. Return to the pan to heat through, seasoning with salt, pepper, lime juice and sugar, if it needs it. Serve drizzled with the remaining coconut milk and scattered with chilli, if you like."}]}</script>
