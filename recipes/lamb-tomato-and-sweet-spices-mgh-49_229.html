<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Lamb tomato and sweet spices","description":"وصفة Lamb tomato and sweet spices التقليدية","image":"https://www.themealdb.com/images/media/meals/qtwtss1468572261.jpg","recipeCategory":"حلويات","cookTime":"PT31M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"220 cal"},"recipeIngredient":["2 tbsp olive oil","4cm piece finely chopped ginger","2 cloves peeled and chopped garlic","800g peeled and chopped tomatoes","2 tbsp lemon juice","1 tsp caster sugar","50 vine leaves","1 large fennel bulb","400g lamb mince","1 medium onion"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Use pickled vine leaves here, preserved in brine. Small delicate leaves are better than the large bristly ones but, if only large leaves are to hand, then trim them to roughly 12 by 12 cms so that you don't get too many layers of leaves around the filling. And remove any stalks. Drain the preserved leaves, immerse them in boiling water for 10 minutes and then leave to dry on a tea towel before use."},{"@type":"HowToStep","position":2,"text":"Basmati rice with butter and pine nuts is an ideal accompaniment. Couscous is great, too. Serves four."},{"@type":"HowToStep","position":3,"text":"First make the filling. Put all the ingredients, apart from the tomatoes, in a bowl. Cut the tomatoes in half, coarsely grate into the bowl and discard the skins. Add half a teaspoon of salt and some black pepper, and stir. Leave on the side, or in the fridge, for up to a day. Before using, gently squeeze with your hands and drain away any juices that come out."},{"@type":"HowToStep","position":4,"text":"To make the sauce, heat the oil in a medium pan. Add the ginger and garlic, cook for a minute or two, taking care not to burn them, then add the tomato, lemon juice and sugar. Season, and simmer for 20 minutes."},{"@type":"HowToStep","position":5,"text":"While the sauce is bubbling away, prepare the vine leaves. Use any torn or broken leaves to line the base of a wide, heavy saucepan. Trim any leaves from the fennel, cut it vertically into 0.5cm-thick slices and spread over the base of the pan to cover completely."},{"@type":"HowToStep","position":6,"text":"Lay a prepared vine leaf (see intro) on a work surface, veiny side up. Put two teaspoons of filling at the base of the leaf in a 2cm-long by 1cm-wide strip. Fold the sides of the leaf over the filling, then roll it tightly from bottom to top, in a cigar shape. Place in the pan, seam down, and repeat with the remaining leaves, placing them tightly next to each other in lines or circles (in two layers if necessary)."},{"@type":"HowToStep","position":7,"text":"Pour the sauce over the leaves (and, if needed, add water just to cover). Place a plate on top, to weigh the leaves down, then cover with a lid. Bring to a boil, reduce the heat and cook on a bare simmer for 70 minutes. Most of the liquid should evaporate. Remove from the heat, and leave to cool a little - they are best served warm. When serving, bring to the table in the pan - it looks great. Serve a few vine leaves and fennel slices with warm rice. Spoon the braising juices on top and garnish with coriander."}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم تستغرق Lamb tomato and sweet spices من الوقت؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج Lamb tomato and sweet spices إلى حوالي 31 دق للتحضير والطهي."}},{"@type":"Question","name":"لكم شخص تكفي Lamb tomato and sweet spices؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة تكفي 3 أشخاص."}},{"@type":"Question","name":"كم عدد السعرات الحرارية في Lamb tomato and sweet spices؟","acceptedAnswer":{"@type":"Answer","text":"تحتوي الحصة الواحدة على حوالي 220 سعرة حرارية و20 غرام بروتين."}},{"@type":"Question","name":"هل Lamb tomato and sweet spices سهلة التحضير؟","acceptedAnswer":{"@type":"Answer","text":"هذه الوصفة سهلة."}},{"@type":"Question","name":"ما هي مكونات Lamb tomato and sweet spices؟","acceptedAnswer":{"@type":"Answer","text":"تحتاج إلى 10 مكونات أساسية منها: olive oil، ginger، garlic، tomatoes، lemon juice."}}]}</script>
