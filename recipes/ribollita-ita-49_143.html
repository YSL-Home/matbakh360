<script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Ribollita","description":"وصفة Ribollita التقليدية","image":"https://www.themealdb.com/images/media/meals/xrrwpx1487347049.jpg","recipeCategory":"سريع","cookTime":"PT25M","recipeYield":"3","nutrition":{"@type":"NutritionInformation","calories":"464 cal"},"recipeIngredient":["5 tablespoons Olive Oil","1 chopped Onion","1 chopped Carrots","1 stalk chopped Celery","1 tablespoon minced Garlic","2 cups Cannellini Beans","1 Canned tomatoes","4 cups Water","1 fresh sprig Rosemary","1 fresh sprig Thyme"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Put 2 tablespoons of the oil in a large pot over medium heat. When it’s hot, add onion, carrot, celery and garlic; sprinkle with salt and pepper and cook, stirring occasionally, until vegetables are soft, 5 to 10 minutes."},{"@type":"HowToStep","position":2,"text":"Heat the oven to 500 degrees. Drain the beans; if they’re canned, rinse them as well. Add them to the pot along with tomatoes and their juices and stock, rosemary and thyme. Bring to a boil, then reduce heat so the soup bubbles steadily; cover and cook, stirring once or twice to break up the tomatoes, until the flavors meld, 15 to 20 minutes."},{"@type":"HowToStep","position":3,"text":"Fish out and discard rosemary and thyme stems, if you like, and stir in kale. Taste and adjust seasoning. Lay bread slices on top of the stew so they cover the top and overlap as little as possible. Scatter red onion slices over the top, drizzle with the remaining 3 tablespoons oil and sprinkle with Parmesan."},{"@type":"HowToStep","position":4,"text":"Put the pot in the oven and bake until the bread, onions and cheese are browned and crisp, 10 to 15 minutes. (If your pot fits under the broiler, you can also brown the top there.) Divide the soup and bread among 4 bowls and serve."}]}</script>
