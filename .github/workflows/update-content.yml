name: 🍽️ Update Recipes & Videos

on:
  schedule:
    # Runs on the 1st and 15th of each month at 08:00 UTC
    - cron: '0 8 1,15 * *'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate new recipes via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat << 'SCRIPT' > generate.mjs
          import { readFileSync, writeFileSync } from 'fs';

          const API_KEY = process.env.ANTHROPIC_API_KEY;
          if (!API_KEY) { console.log('No API key — skipping generation'); process.exit(0); }

          async function callClaude(prompt) {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'x-api-key': API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 8000,
                messages: [{ role: 'user', content: prompt }],
              }),
            });
            const data = await res.json();
            return data.content[0].text;
          }

          // Pick 3 different unusual cuisines for a richer batch
          const cuisines = [
            'Géorgien','Éthiopien','Péruvien','Mongol','Sénégalais','Bolivien',
            'Ouzbek','Philippin','Cambodgien','Laotien','Mauritanien','Paraguayen',
            'Kyrgyz','Biélorusse','Haïtien','Trinidadien','Malagasy','Tanzanien',
            'Yéménite','Omanais','Afghani','Népalais','Tibétain','Bhoutanais',
            'Équatorien','Vénézuélien','Guatémaltèque','Hondurien','Nicaraguayen',
            'Dominicain','Jamaïcain','Cubain','Porto-Ricain','Togolais','Béninois'
          ];

          // Shuffle and pick 3 unique cuisines for this run
          const shuffled = cuisines.sort(() => Math.random() - 0.5);
          const selected = shuffled.slice(0, 3);
          const date = new Date().toISOString().split('T')[0];
          const ts = Date.now();

          console.log(`Generating recipes for: ${selected.join(', ')} — ${date}`);

          let allNewRecipes = [];

          for (let i = 0; i < selected.length; i++) {
            const cuisine = selected[i];
            console.log(`\n[${i+1}/3] Generating 10 ${cuisine} recipes...`);

            const recipePrompt = `Tu es un expert en gastronomie mondiale. Génère 10 recettes ${cuisine} AUTHENTIQUES et VARIÉES pour le site مطبخ 360 (cuisine mondiale en arabe).

Retourne UNIQUEMENT un tableau JSON valide (sans markdown, sans backticks) avec exactement ce format:
[
  {
    "id": "r_${ts}_${i}_1",
    "cid": "auto",
    "f": "🌍",
    "r": "آسيوي",
    "cat": "${cuisine.toLowerCase()}",
    "em": "🍲",
    "img": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500&q=75",
    "ti": "اسم الطبق الأصيل بالعربية",
    "de": "وصف شهي موجز بالعربية يشتهي الإنسان الأكل",
    "tm": "45 دق",
    "sv": 4,
    "df": "m",
    "rt": 4.7,
    "rv": 1200,
    "ing": [{"q": "200غ", "n": "مكون بالعربية"}],
    "steps": [{"t": "الخطوة بالعربية", "tp": "نصيحة الشيف"}],
    "tips": [{"i": "💡", "t": "نصيحة مفيدة بالعربية"}],
    "nut": {"cal": 350, "pro": 20, "carb": 30, "fat": 15},
    "kw": ["كلمة مفتاحية"]
  }
]

Règles:
- 10 recettes DIFFÉRENTES et variées (entrées, plats, desserts, boissons)
- IDs uniques: "r_${ts}_${i}_1", "r_${ts}_${i}_2", ..., "r_${ts}_${i}_10"
- "r" doit être: "عربي", "آسيوي", "أوروبي", "أمريكي", ou "أفريقي" selon la cuisine
- "df" doit être: "e" (سهل), "m" (متوسط), ou "h" (صعب)
- Tout le contenu textuel (ti, de, ing, steps, tips, kw) DOIT être en arabe
- Chaque recette doit avoir au moins 5 ingrédients et 4 étapes
- Retourne UNIQUEMENT le JSON valide, rien d'autre`;

            try {
              const raw = await callClaude(recipePrompt);
              const cleaned = raw.replace(/```json\n?|\n?```/g, '').trim();
              const recipes = JSON.parse(cleaned);
              console.log(`  ✓ Got ${recipes.length} recipes for ${cuisine}`);
              allNewRecipes = [...allNewRecipes, ...recipes];
            } catch(e) {
              console.error(`  ✗ Failed for ${cuisine}:`, e.message);
            }

            // Small delay between API calls
            if (i < selected.length - 1) await new Promise(r => setTimeout(r, 2000));
          }

          console.log(`\nTotal recipes generated: ${allNewRecipes.length}`);

          // Inject all new recipes into index.html
          if (allNewRecipes.length > 0) {
            let html = readFileSync('index.html', 'utf8');
            const label = selected.join('+');
            const newEntries = allNewRecipes.map(r => JSON.stringify(r)).join(',\n  ');
            html = html.replace(
              /(\s*\/\/ ═══ VIDEO DATA ═══)/,
              `\n  // ═══ AUTO-GENERATED ${date} (${label}) — ${allNewRecipes.length} recettes ═══\n  ${newEntries},\n$1`
            );
            writeFileSync('index.html', html, 'utf8');
            console.log(`✓ ${allNewRecipes.length} recipes injected into index.html`);
          }

          console.log('\nContent update complete!');
          SCRIPT
          node generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "Matbakh360 Bot"
          git config user.email "bot@matbakh360.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(git diff --staged index.html | grep -c "^+" || true)
            git commit -m "🍽️ Auto-update: nouvelles recettes $(date +'%Y-%m-%d') (~${COUNT} lignes ajoutées)"
            git push
          fi
