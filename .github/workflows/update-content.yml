name: 🍽️ Update Recipes, Videos & Restaurants

on:
  schedule:
    # Runs on the 1st and 15th of each month at 08:00 UTC
    - cron: '0 8 1,15 * *'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate recipes + new restaurant city via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat << 'SCRIPT' > generate.mjs
          import { readFileSync, writeFileSync } from 'fs';

          const API_KEY = process.env.ANTHROPIC_API_KEY;
          if (!API_KEY) { console.log('No API key — skipping generation'); process.exit(0); }

          async function callClaude(prompt, maxTokens = 6000) {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'x-api-key': API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: maxTokens,
                messages: [{ role: 'user', content: prompt }],
              }),
            });
            const data = await res.json();
            if (!data.content?.[0]?.text) throw new Error(JSON.stringify(data));
            return data.content[0].text;
          }

          function safeJSON(raw) {
            const cleaned = raw.replace(/```json\n?|\n?```/g, '').trim();
            return JSON.parse(cleaned);
          }

          const date = new Date().toISOString().split('T')[0];
          const ts = Date.now();

          // ── 1. RECIPES: 3 unusual cuisines × 10 = 30+ recipes ──────────────
          const cuisines = [
            'Géorgien','Éthiopien','Péruvien','Mongol','Sénégalais','Bolivien',
            'Ouzbek','Philippin','Cambodgien','Laotien','Mauritanien','Paraguayen',
            'Kyrgyz','Biélorusse','Haïtien','Trinidadien','Malagasy','Tanzanien',
            'Yéménite','Omanais','Afghani','Népalais','Tibétain','Bhoutanais',
            'Équatorien','Vénézuélien','Guatémaltèque','Hondurien','Dominicain',
            'Jamaïcain','Cubain','Porto-Ricain','Togolais','Béninois','Réunionnais',
            'Malgache','Comorien','Djiboutien','Érythréen','Somalien'
          ];
          const selected = cuisines.sort(() => Math.random() - 0.5).slice(0, 3);
          console.log(`\n🍳 RECIPES — Cuisines: ${selected.join(', ')}`);

          let allRecipes = [];
          for (let i = 0; i < selected.length; i++) {
            const cuisine = selected[i];
            try {
              const raw = await callClaude(`Tu es un expert gastronomique. Génère 10 recettes ${cuisine} AUTHENTIQUES et VARIÉES.
Retourne UNIQUEMENT un tableau JSON valide (sans markdown) avec ce format exact:
[{"id":"r_${ts}_${i}_1","cid":"auto","f":"🌍","r":"آسيوي","cat":"${cuisine.toLowerCase()}","em":"🍲","img":"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500&q=75","ti":"اسم الطبق بالعربية","de":"وصف شهي بالعربية","tm":"45 دق","sv":4,"df":"m","rt":4.7,"rv":1200,"ing":[{"q":"200غ","n":"مكون"}],"steps":[{"t":"خطوة","tp":"نصيحة"}],"tips":[{"i":"💡","t":"نصيحة"}],"nut":{"cal":350,"pro":20,"carb":30,"fat":15},"kw":["كلمة"]}]
IDs: r_${ts}_${i}_1 jusqu'à r_${ts}_${i}_10. "r" = آسيوي|عربي|أوروبي|أمريكي|أفريقي selon cuisine. Tout le texte en arabe.`);
              const recipes = safeJSON(raw);
              allRecipes = [...allRecipes, ...recipes];
              console.log(`  ✓ ${cuisine}: ${recipes.length} recettes`);
            } catch(e) { console.error(`  ✗ ${cuisine}:`, e.message); }
            if (i < 2) await new Promise(r => setTimeout(r, 1500));
          }

          // ── 2. NEW CITY: restaurants + influencer videos ──────────────────
          const newCities = [
            'بانكوك','سيول','مكسيكو','ليما','برشلونة','روما','فيينا','براغ','مراكش',
            'الجزائر','طرابلس','الرياض','الكويت','مسقط','أبوظبي','الدوحة','بغداد',
            'دمشق','عمّان','صنعاء','خرطوم','أديس أبابا','دكار','أبيدجان','لاغوس',
            'نيروبي','دار السلام','كيب تاون','الدار البيضاء الجديد','فاس','مكناس',
            'سنغافورة','كوالالمبور','جاكرتا','مانيلا','هوشي مينه','بانغكوك','مومباي',
            'كراتشي','لاهور','إسلام آباد','دلهي','كابول','طشقند','ألماتي','باكو',
            'تبليسي','يريفان','بوخارست','صوفيا','أثينا','نابولي','مرسيليا','ليون'
          ];

          // Find already-used cities to avoid repetition
          let html = readFileSync('index.html', 'utf8');
          const usedCities = (html.match(/city:'([^']+)'/g)||[]).map(m=>m.replace("city:'",'').replace("'",''));
          const availCities = newCities.filter(c => !usedCities.includes(c));
          const newCity = availCities[Math.floor(Math.random() * availCities.length)] || newCities[Math.floor(Math.random() * newCities.length)];
          const newCityEn = newCity; // Will use Arabic name as fallback

          console.log(`\n🏙️ NEW CITY: ${newCity}`);

          let newRestos = [], newInfVids = [];
          try {
            const cityPrompt = `Tu es un expert gastronomique mondial. Génère des données pour la ville "${newCity}" pour le site مطبخ 360.

Retourne UNIQUEMENT un objet JSON valide (sans markdown):
{
  "restos": [
    {
      "id": "rst_${ts}_1",
      "name": "اسم المطعم بالعربية",
      "city": "${newCity}",
      "cityEn": "${newCity}",
      "country": "🌍",
      "cuisine": "نوع المطبخ",
      "cusines": ["نوع1", "نوع2"],
      "rating": 4.7,
      "rv": 2500,
      "price": "$$",
      "address": "عنوان المطعم",
      "img": "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&q=75",
      "tags": ["وسم1", "وسم2", "وسم3"],
      "ig": "@handle",
      "tt": "@handle",
      "desc": "وصف جذاب للمطعم بالعربية",
      "hours": "12:00 – 23:00",
      "phone": "+XX XXX XXX XXXX",
      "vids": ["inf_${ts}_1"]
    }
  ],
  "infVids": [
    {
      "id": "inf_${ts}_1",
      "city": "${newCity}",
      "restoId": "rst_${ts}_1",
      "ch": "@InfluencerHandle",
      "pl": "yt",
      "ytid": "dQw4w9WgXcQ",
      "thumb": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=70",
      "title": "عنوان الفيديو بالعربية",
      "tags": ["وسم1", "وسم2"]
    }
  ]
}

Génère 12 restaurants DIFFÉRENTS et VARIÉS et 8 vidéos d'influenceurs pour ${newCity}.
IDs restos: rst_${ts}_1 à rst_${ts}_12. IDs vids: inf_${ts}_1 à inf_${ts}_8.
Utilise le bon emoji drapeau pour "country". Tout le texte en arabe.
Pour les vidéos, varie les plateformes: utilise "pl":"yt" avec ytid, "pl":"tt" avec ttid, "pl":"ig" avec igid (shortcode Instagram ex: B1234abcXYZ).
Varie les types de restaurants, prix ($/$$/$$$/$$$$), quartiers. Adresses réelles.
Retourne UNIQUEMENT le JSON valide.`;

            const raw = await callClaude(cityPrompt, 6000);
            const data = safeJSON(raw);
            newRestos = data.restos || [];
            newInfVids = data.infVids || [];
            console.log(`  ✓ ${newRestos.length} restos, ${newInfVids.length} videos`);
          } catch(e) { console.error('  ✗ City generation failed:', e.message); }

          // ── 3. INJECT INTO index.html ─────────────────────────────────────
          if (allRecipes.length > 0) {
            const recipeEntries = allRecipes.map(r => JSON.stringify(r)).join(',\n  ');
            html = html.replace(
              /(\s*\/\/ ═══ VIDEO DATA ═══)/,
              `\n  // ═══ AUTO ${date} — ${selected.join('+')} — ${allRecipes.length} recettes ═══\n  ${recipeEntries},\n$1`
            );
            console.log(`\n✓ ${allRecipes.length} recettes injectées`);
          }

          if (newRestos.length > 0) {
            const restoEntries = newRestos.map(r => '  '+JSON.stringify(r)).join(',\n');
            // Insert before the closing ]; of RESTAURANTS array
            html = html.replace(
              /(\s*\/\/ ═══ INFLUENCER VIDEOS)/,
              `\n  // ─── ${newCity} (AUTO ${date}) ───\n${restoEntries},\n$1`
            );
            console.log(`✓ ${newRestos.length} restos injectés (${newCity})`);
          }

          if (newInfVids.length > 0) {
            const vidEntries = newInfVids.map(v => '  '+JSON.stringify(v)).join(',\n');
            // Insert at end of INF_VIDS array (before closing ];)
            html = html.replace(
              /(\s*\/\/ ═══════════════════════════════════════════════════\n\/\/ STATE)/,
              `\n  // ─── ${newCity} influencers (AUTO ${date}) ───\n${vidEntries},\n$1`
            );
            console.log(`✓ ${newInfVids.length} vidéos injectées`);
          }

          // Add new city to CITIES array if not already there
          if (newRestos.length > 0 && !html.includes(`'${newCity}'`)) {
            html = html.replace(
              `'مونتريال'\n];`,
              `'مونتريال',\n  '${newCity}'\n];`
            );
          }

          writeFileSync('index.html', html, 'utf8');
          console.log('\n✅ index.html mis à jour');
          SCRIPT
          node generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "Matbakh360 Bot"
          git config user.email "bot@matbakh360.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🍽️ Auto-update $(date +'%Y-%m-%d') — nouvelles recettes + nouvelle ville"
            git push
          fi
