name: "🏙️ Bulk Restaurant Generator — 500+ par ville"

on:
  workflow_dispatch:
    inputs:
      target_city:
        description: "Ville cible en arabe (ex: الدار البيضاء) — vide = TOUTES les 15 villes"
        required: false
        default: ""
      batch_size:
        description: "Restaurants par appel API (recommandé: 25)"
        required: false
        default: "25"
      batches_per_city:
        description: "Lots par ville — 20 lots x 25 = 500 restos/ville"
        required: false
        default: "20"

jobs:
  bulk-restaurants:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run bulk generation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_CITY: ${{ github.event.inputs.target_city }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          BATCHES_PER_CITY: ${{ github.event.inputs.batches_per_city }}
        run: node .github/scripts/bulk-gen.mjs

      - name: Commit and push
        run: |
          git config user.name "Matbakh360 BulkBot"
          git config user.email "bot@matbakh360.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            CITY="${{ github.event.inputs.target_city }}"
            LABEL="${CITY:-toutes les 15 villes}"
            TOTAL=$(( ${{ github.event.inputs.batches_per_city }} * ${{ github.event.inputs.batch_size }} ))
            git commit -m "🏙️ Bulk: ${TOTAL} restos/ville — $LABEL — $(date +'%Y-%m-%d')"
            git push
          fi
