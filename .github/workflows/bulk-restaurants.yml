name: "🏙️ Vrais Restaurants — OpenStreetMap + Claude"

on:
  workflow_dispatch:
    inputs:
      target_city:
        description: "Ville en arabe (ex: باريس) ou anglais (ex: Paris) — vide = toutes les 15 villes"
        required: false
        default: ""
      max_per_city:
        description: "Nombre max de restaurants par ville (OSM peut en avoir moins)"
        required: false
        default: "150"
      radius_m:
        description: "Rayon de recherche en mètres autour du centre-ville"
        required: false
        default: "14000"

jobs:
  bulk-restaurants:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch real restaurants (OpenStreetMap) + enrich (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_CITY:  ${{ github.event.inputs.target_city }}
          MAX_PER_CITY: ${{ github.event.inputs.max_per_city }}
          RADIUS_M:     ${{ github.event.inputs.radius_m }}
        run: node .github/scripts/bulk-gen.mjs

      - name: Commit and push
        run: |
          git config user.name "Matbakh360 OSMBot"
          git config user.email "bot@matbakh360.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            CITY="${{ github.event.inputs.target_city }}"
            LABEL="${CITY:-toutes les 15 villes}"
            git commit -m "🏙️ Vrais restos OSM: $LABEL — $(date +'%Y-%m-%d')"
            git push
          fi
