name: "🍽️ Matbakh360 — Auto-Gen toutes les 3h"

on:
  schedule:
    # Une fois par jour à 03:00 UTC (05:00 heure Maroc)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      recipes_count:
        description: "Nombre de recettes (défaut: 1000)"
        required: false
        default: "1000"
      restos_count:
        description: "Nombre de restaurants (défaut: 200)"
        required: false
        default: "200"
      videos_count:
        description: "Nombre de vidéos (défaut: 200)"
        required: false
        default: "200"
      target_region:
        description: "Région ciblée (vide = toutes)"
        required: false
        default: ""

jobs:
  auto-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120   # 2h max par run

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # historique complet pour rebase

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "🍽️ Génération recettes + restos + vidéos"
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_PLACES_KEY:  ${{ secrets.GOOGLE_PLACES_KEY }}
          RECIPES_COUNT: ${{ github.event.inputs.recipes_count || '1000' }}
          RESTOS_COUNT:  ${{ github.event.inputs.restos_count  || '200'  }}
          VIDEOS_COUNT:  ${{ github.event.inputs.videos_count  || '200'  }}
          TARGET_REGION: ${{ github.event.inputs.target_region || ''    }}
          BATCH: "25"
        run: node .github/scripts/bulk-gen-v2.mjs

      - name: "🖼️ Images réelles restaurants (Google Places)"
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          IMG_BATCH: "500"
        run: node .github/scripts/fetch-real-images.mjs

      - name: "📝 Enrichissement steps + tips recettes"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_SIZE: "100"
        run: node .github/scripts/enrich-steps.mjs

      - name: "🍴 Enrichissement restaurants (menu/phone/website)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_SIZE: "50"
        run: node .github/scripts/enrich-restos.mjs

      - name: "🎬 Génération influenceurs par ville"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INF_BATCH: "10"
        run: node .github/scripts/gen-influencers.mjs

      - name: "🗺️ Sitemap + robots.txt"
        run: node .github/scripts/gen-sitemap.mjs

      - name: "🖼️ Images réelles recettes (TheMealDB + Pexels)"
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMG_BATCH: "150"
        run: node .github/scripts/fetch-recipe-images.mjs

      - name: "📄 Pages SEO statiques recettes"
        env:
          PAGES_BATCH: "500"
        run: node .github/scripts/gen-seo-pages.mjs

      - name: "📦 Commit & Push"
        run: |
          git config user.name  "Matbakh360 Bot"
          git config user.email "bot@matbakh360.com"
          git add index.html sitemap.xml robots.txt data/recipes.json data/restos.json data/vids.json data/influencers.json recipes/ recipes/index.json
          if git diff --staged --quiet; then
            echo "ℹ️ Rien à committer"
          else
            DATE=$(date +'%Y-%m-%d %H:%M')
            git commit -m "🤖 Auto-gen ${DATE} — recettes+restos+vidéos+sitemap"
            git pull --rebase -X theirs origin main
            git push
          fi
