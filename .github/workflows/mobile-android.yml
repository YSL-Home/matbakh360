name: Build Android App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install npm deps
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore (release only)
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/matbakh360.jks
            cat > android/keystore.properties <<EOF
          storeFile=matbakh360.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          fi

      - name: Build AAB (release)
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: mobile/android
        run: ./gradlew bundleRelease

      - name: Build APK (debug)
        if: ${{ github.event.inputs.build_type == 'debug' && !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: matbakh360-release.aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK
        if: ${{ github.event.inputs.build_type == 'debug' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: matbakh360-debug.apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
